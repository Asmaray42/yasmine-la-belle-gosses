  - ["Prolifération des ovogonies semaines 12 à 22", "Semaines 6 à 22 ; ovocytes I dès la 12e", "p.7h"]
  - ["Dictyotène = arrêt en métaphase 2", "Arrêt prolongé en diplotène (2n ×2)", "p.7h"]
  - ["Vésicule germinative = zone pellucide", "Noyau volumineux de l'ovocyte I", "p.7h"]
  - ["Follicules primordiaux formés jusqu'à la puberté", "Jusqu'à la naissance", "p.7h"]
  - ["Zone pellucide sécrétée par la thèque", "Par l'ovocyte et la granulosa", "p.8h"]
  - ["Thèque externe sécrète la progestérone", "Thèque interne", "p.9b"]
  - ["Plusieurs follicules de Graaf par cycle", "Un seul atteint la maturité", "p.10"]

mnemonics:
  - ["Dates", "6 – 12 – 22 : prolifération, ovocytes I, fin de prolifération", "~4 semaines ovogonie → primordial"]
  - ["Follicules", "« Pri-Pri-Se-Ter-Graaf » : aplaties, cuboïdales, granulosa, antre, vascularisation", "5 à 12 survivent / 1 Graaf"]

