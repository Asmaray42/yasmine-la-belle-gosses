    props:
      - ["La prolifération des ovogonies a lieu des semaines 6 à 22.", true, "p.7h."]
      - ["Les ovocytes primaires apparaissent dès la 12e semaine.", true, "p.7h."]
      - ["Le dictyotène est un arrêt prolongé en diplotène.", true, "p.7h."]
      - ["La vésicule germinative est le noyau volumineux de l'ovocyte primaire.", true, "p.7h."]
      - ["Les follicules primordiaux continuent à se former jusqu'à la ménopause.", false, "Jusqu'à la naissance."]
  - q: "Follicules primaire et secondaire :"
    props:
      - ["Le passage primordial → primaire rend les cellules folliculaires cuboïdales.", true, "p.7b."]
      - ["5 à 12 follicules primaires survivent par cycle.", true, "p.7b."]
