  - q: "Follicule tertiaire et Graaf :"
    props:
      - ["L'antre est une cavité dans la granulosa.", true, "p.9b."]
      - ["Le cumulus oophorus entoure l'ovocyte.", true, "p.9b."]
      - ["Selon le cours, la thèque interne sécrète la progestérone.", true, "p.9b."]
      - ["La maturation primordial → Graaf dure un seul cycle.", false, "Plusieurs mois (plusieurs cycles)."]
      - ["Un follicule de Graaf atteint la maturité à chaque cycle.", true, "p.10."]

