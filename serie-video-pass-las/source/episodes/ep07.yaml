  - ["Oublier une des 7 fonctions", "Catalyse, défense, transport, soutien, mouvement, régulation, stockage", "p.33h"]
  - ["Amine sous forme NH2 à pH 7", "NH3+ ; carboxyle sous forme COO–", "p.33b"]
  - ["Histidine essentielle chez l'adulte", "Uniquement chez le nourrisson (h minuscule)", "p.34b"]
  - ["Liaison peptidique par hydrolyse", "Par déshydratation", "p.35h"]
  - ["N-terminal = COO–", "N-terminal = NH3+ ; C-terminal = COO–", "p.35b"]
  - ["Longueur moyenne 1000 aa", "485 acides aminés", "p.36h"]

mnemonics:
  - ["Les 7 fonctions", "« Cathy Défend Ton Sac, Mais Reste Sage »", "Catalyse · Défense · Transport · Soutien · Mouvement · Régulation · Stockage"]
  - ["Les 9 essentiels", "« Film Libre : Il Kiffe (hein) Mais Walter Tourne Vite »", "F Phe · L Leu · I Ile · K Lys · h His (nourrisson) · M Met · W Trp · T Thr · V Val"]

quiz:
  - q: "À propos des fonctions des protéines :"
    props:
      - ["L'hémoglobine est un exemple de protéine de transport.", true, "Elle transporte l'O2 dans le sang."]
      - ["Le stockage du calcium et du fer fait partie des fonctions des protéines.", true, "p.33h."]
      - ["Les protéines n'ont pas de rôle de régulation.", false, "Récepteurs, messagers intercellulaires."]
      - ["La défense correspond à la reconnaissance de microorganismes étrangers.", true, "Système immunitaire."]
      - ["On compte environ 3 000 protéines différentes chez l'homme.", false, "± 30 000."]
  - q: "À propos des acides aminés :"
    props:
      - ["Il existe 20 acides aminés différents.", true, "p.33b."]
      - ["À pH 7, le carboxyle est sous forme COO–.", true, "p.33b."]
      - ["Le tryptophane est essentiel.", true, "W de FLIKhMWTV."]
      - ["Les acides aminés essentiels sont synthétisés par l'organisme.", false, "Non synthétisés, fournis par l'alimentation."]
      - ["L'histidine est essentielle uniquement chez le nourrisson.", true, "h minuscule."]
  - q: "À propos des polypeptides :"
    props:
      - ["La liaison peptidique se forme par une réaction de déshydratation.", true, "p.35h."]
      - ["Une protéine peut être formée de plusieurs polypeptides.", true, "p.35h."]
      - ["Les groupes R forment la chaîne principale constante.", false, "La chaîne principale est constante ; les groupes R sont variables."]
      - ["L'extrémité carboxy-terminale porte COO–.", true, "p.35b."]
      - ["La longueur moyenne des polypeptides humains est de 485 acides aminés.", true, "p.36h."]

