  - ["Cholestérol dans toutes les membranes", "Cholestérol dans les cellules animales", "p.7b"]
  - ["Glycocalyx = glycolipides seuls", "Glycoprotéines + glycolipides", "p.7b"]
  - ["Bicouche perméable aux hydrophiles", "La zone interne apolaire empêche leur passage", "p.8h"]
  - ["Membrane rigide", "Fluide : phospholipides et protéines se déplacent", "p.8h"]
  - ["Enzymes à la face externe", "Face interne de la membrane", "p.8b"]
  - ["Domaine transmembranaire polaire", "Acides aminés apolaires (hydrophobes)", "p.10h"]

mnemonics:
  - ["6 fonctions des protéines membranaires", "« Tu Es Reçu, Mais Attention, Fragile »", "Transporteurs · Enzymes · Récepteurs · Marqueurs · Adhérence · Fixation au cytosquelette"]
  - ["4 composants", "« Le mur, les portes, l'échafaudage, le badge »", "Bicouche · protéines transmembranaires · réseau périphérique · marqueurs (glycocalyx)"]

quiz:
  - q: "Composants de la membrane plasmique :"
    props:
      - ["La bicouche de phospholipides forme une barrière imperméable.", true, "p.7b."]
      - ["Le cholestérol est présent dans la membrane des cellules animales.", true, "p.7b."]
      - ["Les marqueurs de surface forment ensemble le glycocalyx.", true, "p.7b."]
      - ["Le réseau de protéines périphériques est extracellulaire.", false, "Il est intracellulaire, lié au cytosquelette."]
      - ["Les marqueurs de surface donnent l'identité des cellules.", true, "p.7b."]
  - q: "Bicouche et fluidité :"
    props:
      - ["Les phospholipides forment spontanément une bicouche.", true, "p.8h."]
      - ["La zone interne apolaire empêche le passage des substances hydrophiles.", true, "p.8h."]
      - ["Les protéines membranaires sont immobiles.", false, "Elles se déplacent grâce à la fluidité."]
      - ["Les phospholipides peuvent se déplacer les uns par rapport aux autres.", true, "Fluidité."]
      - ["Les têtes polaires sont tournées vers le centre de la bicouche.", false, "Vers le fluide extracellulaire et le cytosol."]
  - q: "Protéines membranaires :"
    props:
      - ["Les transporteurs sont de deux types : canaux ou transporteurs.", true, "p.8b."]
      - ["Les marqueurs de surface sont le plus souvent des glycoprotéines.", true, "p.9h."]
      - ["Les protéines d'adhérence assurent des interactions momentanées ou permanentes.", true, "p.9b."]
      - ["Les protéines extrinsèques possèdent un domaine transmembranaire.", false, "Elles sont fixées par des molécules d'ancrage."]
