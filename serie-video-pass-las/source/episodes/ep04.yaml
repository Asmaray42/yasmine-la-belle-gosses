title: "Le carbone, architecte des molécules du vivant"
subtitle: "Tétravalence · hydrocarbures · 6 groupes fonctionnels · polymères · 4 familles"
source: "S1-1 p.17b à 22h"
chapter: "Partie I — Chapitre II. Les composés du vivant — 3. La chimie du carbone · 4. Les macromolécules (début)"
objectives:
  - "Expliquer pourquoi le carbone est la charpente des molécules biologiques (tétravalence, types de chaînes)."
  - "Décrire les hydrocarbures et leurs propriétés."
  - "Connaître les 6 groupes fonctionnels du cours : formule, exemple, molécules où ils sont présents, propriétés."
  - "Définir polymère et monomère ; distinguer déshydratation et hydrolyse."
  - "Restituer le tableau des 4 groupes de macromolécules biologiques (sous-unités, fonctions, exemples)."

scenes:
  - kind: hook
    title: "Un seul atome pour construire le vivant"
    ref: "S1-1 p.18"
    big: "C"
    beats:
      - say: "Le diamant et ta peau ont un point commun : le carbone. Le cours le dit : l'atome de carbone constitue la charpente de la majorité des molécules biologiques."
      - say: "Aujourd'hui : pourquoi le carbone, les groupes fonctionnels qui lui donnent ses propriétés, et le grand tableau des macromolécules."
        show: "Tétravalence · groupes fonctionnels · *polymères* · *4 familles*"

  - kind: figure
    title: "La charpente carbonée"
    ref: "S1-1 p.18"
    fig: "S1-1:18h"
    trap: "Le carbone forme la charpente ; s'y ajoutent H, O, N, P, S."
    beats:
      - say: "Troisième point du chapitre deux : la chimie du carbone. Le carbone constitue la charpente de la majorité des molécules biologiques."
        mark: "charpente"
        show: "Le carbone = *charpente* de la majorité des molécules biologiques"
      - say: "Il s'associe à cinq autres atomes : l'hydrogène, l'oxygène, l'azote, le phosphore, noté phosphate sur la diapo, et le soufre."
        focus: "all"
        show: "C + H · O · N · P (phosphate) · S"

  - kind: figure
    title: "1. La tétravalence du carbone"
    ref: "S1-1 p.18"
    fig: "S1-1:18b"
    trap: "Tétravalent = 4 liaisons ; chaînes simples, ramifiées, en anneau ; cristal de carbone = diamant."
    beats:
      - say: "Le carbone est *tétravalent* : il forme quatre liaisons."
        focus: [0.05, 0.25, 0.45, 0.65]
        mark: "tétravalent"
        show: "Carbone *tétravalent* : 4 liaisons"
      - say: "Ça lui permet de former des *chaînes simples*, des *chaînes ramifiées*, et des *structures en anneau*."
        focus: [0.45, 0.2, 1.0, 0.95]
        mark: ["chaînes simples", "chaînes ramifiées", "structure en anneau"]
        show: "Chaînes *simples* · chaînes *ramifiées* · structures en *anneau*"
      - say: "Et quand le carbone forme un cristal, ça donne… le diamant."
        focus: [0.0, 0.62, 0.55, 1.0]
        mark: "diamant"
        show: "Cristal de carbone = *diamant*"

  - kind: figure
    title: "2. Les hydrocarbures"
    ref: "S1-1 p.19"
    fig: "S1-1:19h"
    trap: "Uniquement C et H ; liaisons C–H riches en énergie ; molécules apolaires."
    beats:
      - say: "Les *hydrocarbures* sont formés *uniquement* de carbone et d'hydrogène."
        mark: "uniquement"
        show: "Hydrocarbures = *uniquement* C et H"
      - say: "Leurs liaisons C H sont *riches en énergie* : ce sont les carburants."
        mark: "riches en énergie"
        show: "Liaisons C–H *riches en énergie* (carburants)"
      - say: "Et comme les liaisons C C et C H sont équilibrées, ils sont *apolaires*. Exemple du cours : le propane, C3H8."
        mark: ["apolaires", "propane"]
        show: "Liaisons équilibrées ⇒ *apolaires* · ex. *propane* C₃H₈"

  - kind: figure
    title: "3. Les groupes fonctionnels (1/2)"
    ref: "S1-1 p.19"
    fig: "S1-1:19b"
    trap: "Hydroxyle = polaire (dissolution) ; carbonyle = fortement polaire ; carboxyle = source de H+ (acide)."
    beats:
      - say: "Sur le squelette C H se greffent des *groupes fonctionnels*, qui impliquent d'autres atomes : oxygène, azote, soufre, phosphore. Le cours en présente six."
        focus: [0.0, 0.1, 1.0, 0.35]
        mark: "groupes fonctionnels"
      - say: "Un : l'*hydroxyle*, ou alcool, O H. Exemple : l'éthanol. Présent dans les glucides, les protéines, les acides nucléiques et les lipides. Il est polaire, attire les molécules d'eau, et facilite donc la dissolution des composés organiques."
        focus: [0.0, 0.3, 1.0, 0.6]
        mark: "Hydroxyle"
        show: "*Hydroxyle* (alcool) –OH · éthanol · polaire, attire l'eau ⇒ facilite la dissolution"
      - say: "Deux : le *carbonyle*, C double liaison O. Exemple : l'acétaldéhyde. Présent dans les glucides et les acides nucléiques. Il est fortement polaire."
        focus: [0.0, 0.5, 1.0, 0.8]
        mark: "Carbonyle"
        show: "*Carbonyle* C=O · acétaldéhyde · *fortement* polaire"
      - say: "Trois : le *carboxyle*, C O O H. Exemple : l'acide acétique. Présent dans les protéines et les lipides. C'est une *source de protons*, de H plus : il a des propriétés *acides*, et devient C O O moins."
        focus: [0.0, 0.62, 1.0, 1.0]
        mark: "Carboxyle"
        show: "*Carboxyle* –COOH · acide acétique · source de H⁺ ⇒ *acide* (→ COO⁻)"

  - kind: figure
    title: "3. Les groupes fonctionnels (2/2)"
    ref: "S1-1 p.20"
    fig: "S1-1:20h"
    trap: "Amine = base (accepte H+, souvent –NH3+) ; thiol = ponts disulfure ; phosphate = ion négatif, transfert d'énergie."
    beats:
      - say: "Quatre : l'*amine*, N H 2. Exemple : l'alanine. Présente dans les protéines et les acides nucléiques. Elle peut *accepter* des H plus : c'est une *base*, souvent ionisée, de charge plus un : N H 3 plus."
        focus: [0.0, 0.25, 1.0, 0.6]
        mark: "Amine"
        show: "*Amine* –NH₂ · alanine · accepte des H⁺ ⇒ *base*, souvent –NH₃⁺ (charge +1)"
      - say: "Cinq : le *sulfhydryle*, ou *thiol*, S H. Exemple : la cystéine. Présent dans les protéines. Deux thiols peuvent se combiner pour former des liens : les *ponts disulfure*."
        focus: [0.0, 0.5, 1.0, 0.75]
        mark: "thiol"
        show: "*Sulfhydryle* (thiol) –SH · cystéine · 2 à 2 ⇒ *ponts disulfure*"
      - say: "Six : le *phosphate*, O P O 3 deux moins. Exemple : le glycérol phosphate. Présent dans les acides nucléiques. Il forme un ion de charge négative, et permet le *transfert d'énergie* d'une molécule à l'autre."
        focus: [0.0, 0.65, 1.0, 1.0]
        mark: "Phosphate"
        show: "*Phosphate* –OPO₃²⁻ · glycérol phosphate · ion négatif · *transfert d'énergie*"

  - kind: mnemo
    title: "Six groupes, six personnalités"
    ref: "S1-1 p.19-20"
    phrase: "*OH* « Oh, de l'eau ! » · *COOH* donne · *NH₂* prend · *SH* soude · *P* propulse"
    trap: "Carboxyle = acide (cède un H+) ; amine = base (accepte un H+). Ne pas inverser."
    beats:
      - say: "Une personnalité par groupe."
      - say: "L'hydroxyle, O H : “Oh, de l'eau !” Il attire l'eau et aide à dissoudre."
        show: "*OH* hydroxyle : « Oh, de l'eau ! » → polaire, dissolution"
      - say: "Le carbonyle, C double liaison O : le plus polaire du lot, “fortement polaire”."
        show: "*C=O* carbonyle : *fortement* polaire"
      - say: "Le carboxyle, C O O H, est généreux : il *donne* son H plus. Il est acide."
        show: "*COOH* carboxyle : *donne* H⁺ → acide"
      - say: "L'amine, N H 2, est gourmande : elle *prend* un H plus. C'est une base."
        show: "*NH₂* amine : *prend* H⁺ → base (NH₃⁺)"
      - say: "Le thiol, S H, est un soudeur : deux thiols se soudent en pont disulfure."
        show: "*SH* thiol : se *soude* 2 à 2 → pont disulfure"
      - say: "Et le phosphate propulse l'énergie d'une molécule à l'autre."
        show: "*Phosphate* : *propulse* l'énergie (ion –)"

  - kind: quiz
    title: "Quiz express n°1"
    ref: "S1-1 p.19-20"
    question: "Quel groupe fonctionnel est une source de protons (H⁺) et a des propriétés acides ?"
    options:
      - "L'amine –NH₂"
      - "Le carboxyle –COOH"
      - "Le thiol –SH"
      - "Le carbonyle C=O"
    answer: [1]
    beats:
      - say: "Quiz : quel groupe est une source de protons, avec des propriétés acides ?"
        countdown: 4
      - say: "Le carboxyle : il donne son H plus et devient C O O moins. L'amine, elle, accepte les H plus : c'est une base."
        reveal: true

  - kind: figure
    title: "4. Les macromolécules : des polymères"
    ref: "S1-1 p.20-21"
    fig: "S1-1:21h"
    trap: "Polymère = succession de sous-unités SIMILAIRES (monomères)."
    beats:
      - say: "Quatrième point du chapitre : les macromolécules. Ce sont des *polymères*."
        focus: "all"
      - say: "Un polymère est l'assemblage d'une succession de petites sous-unités chimiques similaires, les *monomères*. Exemple du cours : l'amidon."
        mark: ["Polymère", "monomères"]
        show: "*Polymère* = succession de sous-unités similaires (*monomères*) · ex. *amidon*"

  - kind: figure
    title: "Déshydratation et hydrolyse"
    ref: "S1-1 p.21"
    fig: "S1-1:21b"
    trap: "Déshydratation = assemblage (synthèse, polymérisation) ; hydrolyse = rupture."
    beats:
      - say: "Deux réactions opposées. La *déshydratation* : c'est la réaction d'*assemblage*, la synthèse des monomères, la polymérisation."
        mark: "Déshydratation"
        show: "*Déshydratation* = *assemblage* (synthèse) des monomères = polymérisation"
      - say: "L'*hydrolyse* : c'est la réaction de *rupture* de la liaison entre les monomères."
        mark: "Hydrolyse"
        show: "*Hydrolyse* = *rupture* de la liaison des monomères"
      - say: "Astuce : déshydratation, on retire de l'eau pour coller ; hydrolyse, l'eau vient couper."
        show: "[C] Dés-hydrat-ation : on retire l'eau pour coller · hydro-lyse : l'eau coupe"

  - kind: trap
    title: "Ne confonds pas assemblage et rupture"
    ref: "S1-1 p.21"
    trap: "Déshydratation = synthèse ; hydrolyse = rupture."
    beats:
      - say: "Le piège."
      - say: "“L'hydrolyse permet la polymérisation” : faux."
        show: "✗ « L'hydrolyse assemble les monomères »"
      - say: "La polymérisation, c'est la déshydratation. L'hydrolyse rompt la liaison entre monomères."
        show: "✓ Polymérisation = *déshydratation* · rupture = *hydrolyse*"

  - kind: figure
    title: "Quatre groupes de macromolécules biologiques"
    ref: "S1-1 p.22"
    fig: "S1-1:22h"
    trap: "Sous-unité, fonction et exemple de chaque ligne du tableau."
    beats:
      - say: "Voici le tableau-clé du chapitre : quatre groupes de macromolécules, avec leur sous-unité, leur fonction et un exemple."
        focus: "all"
      - say: "Les *glucides* : amidon et glycogène, faits de glucose, pour le stockage d'énergie, comme dans les patates. La cellulose, faite de glucose, pour les parois cellulaires des plantes, comme les fils de céleri. La chitine, faite de glucose modifié, comme support structural, dans la carapace du crabe."
        focus: [0.0, 0.25, 1.0, 0.5]
        mark: "Glucides"
      - say: "Les *acides nucléiques* : l'ADN, fait de nucléotides, porte l'information, dans les chromosomes. L'ARN, fait de nucléotides, sert à l'expression de l'information, comme l'ARN messager."
        focus: [0.0, 0.4, 1.0, 0.62]
        mark: "Acides Nucléiques"
      - say: "Les *protéines*, faites d'acides aminés : de fonction, pour la catalyse et le transport, comme l'hémoglobine ; de structure, pour le support, comme les cheveux."
        focus: [0.0, 0.5, 1.0, 0.72]
        mark: "Protéines"
      - say: "Les *lipides* : les triglycérides, glycérol et acides gras, pour le stockage d'énergie, comme le beurre et l'huile d'olive. Les phospholipides, glycérol, acides gras et groupes polaires, pour les membranes cellulaires, comme la phosphatidylcholine. Les prostaglandines, cycles carbonés et queues apolaires, messagers chimiques. Les stéroïdes, cycles carbonés, pour les membranes et les hormones, comme le cholestérol et l'œstrogène. Et les terpènes, chaînes carbonées, pigments et défense, comme le carotène et le latex."
        focus: [0.0, 0.6, 1.0, 0.92]
        mark: "Lipides"

  - kind: table
    title: "Le tableau en version smartphone"
    ref: "S1-1 p.22"
    header: ["Molécule", "Sous-unité", "Fonction", "Exemple"]
    beats:
      - say: "En version lisible, ligne par ligne."
      - say: "Glucides."
        show: "Amidon, glycogène | glucose | stockage d'énergie | patates"
      - show: "Cellulose | glucose | parois cell. des plantes | fils de céleri"
        hold: 1.2
      - show: "Chitine | glucose modifié | support structural | carapace du crabe"
        hold: 1.2
      - say: "Acides nucléiques."
        show: "ADN | nucléotides | information | chromosomes"
      - show: "ARN | nucléotides | expression de l'info. | ARN messager"
        hold: 1.2
      - say: "Protéines."
        show: "Protéines de fonction | acides aminés | catalyse, transport | hémoglobine"
      - show: "Protéines de structure | acides aminés | support | cheveux"
        hold: 1.2
      - say: "Lipides."
        show: "Triglycérides | glycérol, acides gras | stockage d'énergie | beurre, huile d'olive"
      - show: "Phospholipides | glycérol, acides gras, gr. polaires | membranes cell. | phosphatidylcholine"
        hold: 1.2
      - show: "Prostaglandines | cycles carbonés, queues apolaires | messager chimique | prostaglandine"
        hold: 1.2
      - show: "Stéroïdes | cycles carbonés | membranes, hormones | cholestérol, œstrogène"
        hold: 1.2
      - show: "Terpènes | chaînes carbonées | pigments, défense | carotène, latex"
        hold: 1.5

  - kind: mnemo
    title: "Retenir les 5 familles de lipides"
    ref: "S1-1 p.22"
    phrase: "*Tr*ès *Ph*eu de *Pro*fs *Sté*ressés sont *Ter*nes"
    trap: "Les 5 lignes « lipides » : triglycérides, phospholipides, prostaglandines, stéroïdes, terpènes."
    beats:
      - say: "Les cinq lignes de lipides, dans l'ordre : “Très peu de profs stressés sont ternes.” Triglycérides, phospholipides, prostaglandines, stéroïdes, terpènes."
        show: "*Tri*glycérides · *Pho*spholipides · *Pro*staglandines · *Sté*roïdes · *Ter*pènes"
      - say: "Et pour les glucides : deux fonctions de stockage, avec amidon et glycogène, et deux de structure, avec cellulose et chitine."
        show: "Glucides : *stockage* (amidon, glycogène) · *structure* (cellulose, chitine)"

  - kind: quiz
    title: "Quiz express n°2"
    ref: "S1-1 p.22"
    question: "Selon le tableau, quelle association est exacte ?"
    options:
      - "Chitine — glucose modifié — support structural — carapace du crabe"
      - "Cellulose — acides aminés — support — cheveux"
      - "ARN — nucléotides — information — chromosomes"
      - "Stéroïdes — glycérol, acides gras — stockage d'énergie"
    answer: [0]
    beats:
      - say: "Dernier quiz : quelle association est exacte ?"
        countdown: 5
      - say: "Réponse A. La cellulose est faite de glucose, l'ARN sert à l'expression de l'information, et les stéroïdes sont faits de cycles carbonés."
        reveal: true

  - kind: recap
    title: "Récap de l'épisode"
    ref: "S1-1 p.18-22"
    beats:
      - say: "On récapitule."
      - say: "Le carbone, tétravalent, forme la charpente des molécules biologiques : chaînes simples, ramifiées, anneaux."
        show: "C *tétravalent* : chaînes simples, ramifiées, anneaux (diamant)"
      - say: "Hydrocarbures : seulement C et H, riches en énergie, apolaires."
        show: "Hydrocarbures : C + H, riches en énergie, *apolaires*"
      - say: "Six groupes fonctionnels : hydroxyle, carbonyle, carboxyle acide, amine basique, thiol et ponts disulfure, phosphate et transfert d'énergie."
        show: "OH · C=O · COOH (acide) · NH₂ (base) · SH (ponts disulfure) · phosphate (énergie)"
      - say: "Déshydratation, on assemble ; hydrolyse, on rompt. Et quatre familles : glucides, acides nucléiques, protéines, lipides."
        show: "Déshydratation = assemblage · hydrolyse = rupture · *4* familles"

  - kind: outro
    title: "Épisode 5 : les glucides"
    ref: "S1-1 p.22-26"
    big: "α ou β ?"
    beats:
      - say: "Prochain épisode : les glucides. Et une seule lettre grecque sépare l'amidon de la cellulose. Laquelle ? Réponse dans l'épisode cinq."
        show: "Amidon vs cellulose : *α* ou *β* ?"

recap:
  - "L'atome de carbone constitue la charpente de la majorité des molécules biologiques ; il s'associe à H, O, N, P (phosphate) et S."
  - "Tétravalence du carbone : chaînes simples, chaînes ramifiées, structures en anneau ; cristal de carbone = diamant."
  - "Hydrocarbures : formés uniquement de carbone et d'hydrogène ; liaisons C–H riches en énergie (carburants) ; liaisons C–C et C–H équilibrées ⇒ apolaires ; ex. propane (C3H8)."
  - "Groupes fonctionnels greffés sur le squelette C–H (impliquant O, N, S, P) : hydroxyle –OH (alcool ; éthanol ; glucides, protéines, acides nucléiques, lipides ; polaire, attire l'eau ⇒ facilite la dissolution) ; carbonyle C=O (acétaldéhyde ; glucides, acides nucléiques ; fortement polaire) ; carboxyle –COOH (acide acétique ; protéines, lipides ; source de protons H+ ⇒ propriétés acides, COOH → COO– + H+) ; amine –NH2 (alanine ; protéines, acides nucléiques ; peut accepter des H+ (base), souvent ionisée, charge +1 : –NH3+) ; sulfhydryle (thiol) –SH (cystéine ; protéines ; se combinent 2 à 2 en ponts disulfure) ; phosphate –OPO3²⁻ (glycérol phosphate ; acides nucléiques ; ion de charge négative ; transfert d'énergie d'une molécule à l'autre)."
  - "Polymère : assemblage d'une succession de petites sous-unités chimiques similaires (monomères) ; ex. amidon. Déshydratation = réaction d'assemblage (synthèse) des monomères (polymérisation) ; hydrolyse = réaction de rupture de la liaison des monomères."
  - "Quatre groupes de macromolécules biologiques (sous-unité / fonction / exemple) : glucides — amidon, glycogène (glucose ; stockage d'énergie ; patates), cellulose (glucose ; parois cell. des plantes ; fils de céleri), chitine (glucose modifié ; support structural ; carapace du crabe) ; acides nucléiques — ADN (nucléotides ; information ; chromosomes), ARN (nucléotides ; expression de l'info. ; ARN messager) ; protéines — de fonction (acides aminés ; catalyse, transport ; hémoglobine), de structure (acides aminés ; support ; cheveux) ; lipides — triglycérides (glycérol, acides gras ; stockage d'énergie ; beurre, huile d'olive), phospholipides (glycérol, acides gras, gr. polaires ; membranes cell. ; phosphatidylcholine), prostaglandines (cycles carbonés, queues apolaires ; messager chimique ; prostaglandine), stéroïdes (cycles carbonés ; membranes, hormones ; cholestérol, œstrogène), terpènes (chaînes carbonées ; pigments, défense ; carotène, latex)."

traps:
  - ["« Les hydrocarbures sont polaires »", "Liaisons C–C et C–H équilibrées ⇒ apolaires", "p.19h"]
  - ["Inverser carboxyle et amine", "Carboxyle = source de H+ (acide) ; amine = accepte des H+ (base, –NH3+)", "p.19b-20h"]
  - ["« Le carbonyle est apolaire »", "Fortement polaire", "p.19b"]
  - ["Ponts disulfure attribués aux phosphates", "Ponts disulfure = 2 thiols (–SH), ex. cystéine", "p.20h"]
  - ["« Le phosphate porte une charge positive »", "Ion de charge négative ; transfert d'énergie", "p.20h"]
  - ["Hydrolyse = polymérisation", "Déshydratation = assemblage ; hydrolyse = rupture", "p.21b"]
  - ["Cellulose = stockage d'énergie", "Cellulose = parois cellulaires des plantes ; amidon/glycogène = stockage", "p.22h"]
  - ["Chitine faite de glucose « simple »", "Glucose modifié ; support structural ; carapace du crabe", "p.22h"]
  - ["Stéroïdes faits de glycérol et d'acides gras", "Stéroïdes = cycles carbonés ; triglycérides/phospholipides = glycérol + acides gras", "p.22h"]

mnemonics:
  - ["Les 6 groupes fonctionnels", "OH « Oh, de l'eau ! » · C=O le plus polaire · COOH donne · NH2 prend · SH soude · phosphate propulse", "Hydroxyle (dissolution) · carbonyle (fortement polaire) · carboxyle (acide) · amine (base) · thiol (ponts disulfure) · phosphate (énergie)"]
  - ["Déshydratation / hydrolyse", "On retire l'eau pour coller ; l'eau vient couper", "Déshydratation = assemblage ; hydrolyse = rupture"]
  - ["Les 5 lignes « lipides » du tableau", "« Très peu de profs stressés sont ternes »", "Triglycérides · phospholipides · prostaglandines · stéroïdes · terpènes"]

quiz:
  - q: "À propos de la chimie du carbone :"
    props:
      - ["Le carbone est tétravalent.", true, "p.18b."]
      - ["Le carbone peut former des chaînes ramifiées et des structures en anneau.", true, "Avec les chaînes simples."]
      - ["Un cristal de carbone correspond au diamant.", true, "« cristal de carbone = diamant »."]
      - ["Les hydrocarbures contiennent obligatoirement de l'oxygène.", false, "Ils sont formés uniquement de carbone et d'hydrogène."]
      - ["Les hydrocarbures sont apolaires.", true, "Liaisons C–C et C–H équilibrées."]
  - q: "À propos des groupes fonctionnels :"
    props:
      - ["Le groupe hydroxyle (–OH) facilite la dissolution de composés organiques.", true, "Polaire, attire les molécules d'eau."]
      - ["Le groupe carboxyle (–COOH) a des propriétés basiques.", false, "Source de protons ⇒ propriétés acides."]
      - ["Le groupe amine (–NH2) peut accepter des H+.", true, "Base, souvent ionisée (charge +1)."]
      - ["Deux groupes thiol (–SH) peuvent former un pont disulfure.", true, "Ils se combinent 2 à 2."]
      - ["Le groupe phosphate permet le transfert d'énergie d'une molécule à l'autre.", true, "Ion de charge négative."]
  - q: "À propos des polymères :"
    props:
      - ["Un polymère est une succession de sous-unités chimiques similaires.", true, "Les monomères."]
