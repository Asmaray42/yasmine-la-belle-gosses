    props:
      - ["Le pic de LH survient vers J13/14 du cycle.", true, "p.11h."]
      - ["Le pic de LH entraîne l'accomplissement de la méiose 1.", true, "p.11h."]
      - ["La cytocinèse entre l'ovocyte II et le 1er globule polaire est complète.", false, "Incomplète, ponts cytoplasmiques."]
      - ["La granulosa sécrète de l'acide hyaluronique.", true, "p.11b."]
      - ["L'ovocyte entame la méiose 2 jusqu'en métaphase 2.", true, "p.11b."]
  - q: "Ovulation :"
    props:
      - ["L'ovulation a lieu 38 heures après le pic de LH.", true, "p.12h."]
      - ["Le stigma est une zone de compression des vaisseaux sanguins.", true, "p.12h."]
      - ["L'ovocyte II est libéré avec sa corona radiata.", true, "p.12b."]
      - ["La progestérone déversée attire les spermatozoïdes.", true, "p.12b."]
