mnemonics:
  - ["Sens de l'osmose", "« L'eau court vers le sel » : elle dilue le plus concentré", "Eau → solution hypertonique"]
  - ["Perméase = tourniquet", "Un tourniquet de stade : une personne à la fois → saturation", "Fixation → saturation, vitesse limitée"]

quiz:
  - q: "Diffusion :"
    props:
      - ["La diffusion simple concerne les molécules apolaires non chargées.", true, "p.12b."]
      - ["Le CO2 traverse la bicouche par diffusion simple.", true, "p.12b."]
      - ["La diffusion facilitée se fait contre le gradient de concentration.", false, "Selon le gradient."]
      - ["La diffusion facilitée utilise des canaux ou des transporteurs.", true, "p.13h."]
      - ["Certains canaux ioniques sont régulables.", true, "Ouverts ou fermés."]
  - q: "Transporteurs et osmose :"
    props:
      - ["Les transporteurs sont aussi appelés perméases.", true, "p.14h."]
      - ["Les transporteurs fonctionnent dans un seul sens.", false, "Ils peuvent fonctionner dans les deux sens."]
      - ["En osmose, l'eau migre vers la solution la plus concentrée.", true, "p.14b."]
      - ["Deux solutions de même concentration osmotique sont isotoniques.", true, "p.14b."]
      - ["La pression osmotique est la pression à appliquer pour arrêter le flux d'eau.", true, "p.14b."]
  - q: "Applications :"
    props:
      - ["Les perfusions doivent être isotoniques par rapport au sang.", true, "p.15h."]
      - ["Le liquide physiologique contient 0,9 % de NaCl.", true, "p.15h."]
      - ["L'eau diffuse très facilement à travers la bicouche.", false, "Sa capacité de diffusion est faible."]
      - ["Un dysfonctionnement d'AQP2 provoque une forme de diabète insipide.", true, "p.15b."]
      - ["Le diabète insipide lié à AQP2 se traduit par une urine concentrée et rare.", false, "Urine diluée abondante (jusqu'à 10 L/jour)."]

