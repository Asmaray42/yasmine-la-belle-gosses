  - ["Bicouche perméable aux polaires", "Perméable aux apolaires, imperméable aux polaires", "p.10b"]
  - ["Hormones stéroïdes = diffusion facilitée", "Diffusion simple (apolaires)", "p.12b"]
  - ["Diffusion facilitée avec énergie", "Ne requiert pas d'énergie", "p.13h"]
  - ["Canaux saturables", "Saturation = transporteurs (perméases)", "p.14h"]
  - ["Eau → solution moins concentrée", "Eau → solution la plus concentrée (hypertonique)", "p.14b"]
  - ["Liquide physiologique à 9 %", "0,9 % NaCl", "p.15h"]
