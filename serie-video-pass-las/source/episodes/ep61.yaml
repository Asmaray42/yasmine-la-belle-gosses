  - ["En moyenne 2 ovocytes par ponction", "En moyenne 10", "p.35"]
  - ["Percoll 20 % et 60 %", "Percoll 45 % et 90 %", "p.36"]
  - ["ICSI pour tous les couples", "Si sperme de mauvaise qualité (ZP infranchissable)", "p.37"]
  - ["3 pronuclei attendus", "2 pronuclei, 2-3 globules polaires", "p.38"]
  - ["Blastocyste = plus d'embryons disponibles", "4-8 cellules = plus d'embryons ; blastocyste = un peu plus efficace", "p.39"]
  - ["Transfert de 4 embryons", "1 ou 2 embryons", "p.41"]

mnemonics:
  - ["Stimulation", "Bloquer (GnRH) → stimuler (FSH) → déclencher (hCG)", "Suivi échographique"]
  - ["Contrôle J1", "2 et 2-3 : 2 pronuclei, 2-3 globules polaires", "Le lendemain de la fertilisation"]
  - ["Percoll", "45 en haut, 90 en bas : les bons descendent le plus bas", "Anormaux à l'interphase"]

quiz:
  - q: "Indications et stimulation :"
    props:
      - ["La FIVETE est indiquée en cas de stérilité inexpliquée, non résolue.", true, "p.32."]
      - ["Le traitement hormonal vise les problèmes d'ovulation.", true, "p.32."]
      - ["Le blocage de l'ovulation spontanée utilise des inhibiteurs de GnRH.", true, "p.34."]
      - ["L'hCG est utilisée pour sa similitude avec la FSH.", false, "Avec la LH."]
      - ["La stimulation est suivie par échographie.", true, "p.34."]
  - q: "Ponction et spermatozoïdes :"
    props:
      - ["La ponction se fait par voie transvaginale sous anesthésie.", true, "p.35."]
      - ["Les ovocytes sont mis en culture à 37 °C.", true, "p.35."]
      - ["On récolte en moyenne 10 ovocytes par ponction.", true, "p.35."]
      - ["Les spermatozoïdes normaux restent à l'interphase du Percoll.", false, "Les anormaux ; les normaux sont au fond."]
      - ["La capacitation in vitro utilise un lavage, de l'albumine et du Ca2+.", true, "p.36."]
  - q: "Fécondation, sélection et transfert :"
    props:
      - ["L'ICSI est indiquée si la zone pellucide est infranchissable.", true, "p.37."]
      - ["Les ovocytes matures sont reconnus au 1er globule polaire.", true, "p.37."]
      - ["Le lendemain, on attend 2 pronuclei et 2-3 globules polaires.", true, "p.38."]
      - ["Le transfert au stade blastocyste a lieu aux jours 2-3.", false, "Jours 5-6 ; 4-8 cellules aux jours 2-3."]
      - ["On transfère 1 ou 2 embryons au fond de la cavité utérine.", true, "p.41."]

