  - ["Ovule libéré à l'ovulation", "Ovocyte secondaire (métaphase 2) ; ovule après fécondation", "p.50h"]
  - ["Arrêt fœtal en pachytène", "Arrêt au diplotène", "p.50h"]
  - ["Division égale de l'ovocyte", "Division inégale (ovocyte + globule polaire)", "p.50h"]
  - ["Turner = XXY", "Turner = X0 (femme) ; Klinefelter = XXY (homme)", "p.51b"]
  - ["Trisomie 21 : 1/8000", "1/800, augmente avec l'âge de la mère", "p.51h"]

