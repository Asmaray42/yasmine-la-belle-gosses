title: "Asymétrie gauche-droite : flux nodal & cordon ombilical"
subtitle: "Shh → Nodal → Lefty2 → Pitx2 · Lrd · situs inversus · Kartagener · monocils · cordon · 5 mm"
source: "S2-2 p.28b à 32h"
chapter: "Partie II — V. Étape de soulèvement de l'embryon — 3 et 4"
objectives:
  - "Citer des organes asymétriques et la cascade Shh → Nodal → Lefty2 → Pitx2."
  - "Décrire le modèle de souris situs inversus (Lrd) et le syndrome de Kartagener."
  - "Expliquer la théorie du flux nodal (monocils, Lrd, flux vers la gauche)."
  - "Décrire la formation du cordon ombilical et l'embryon de 4 semaines."

scenes:
  - kind: hook
    title: "Pourquoi ton cœur est à gauche"
    ref: "S2-2 p.30b"
    big: "←"
    beats:
      - say: "Ton cœur est à gauche parce que, dans l'embryon, de minuscules cils ont fait tourbillonner un liquide vers la gauche."
      - say: "Au programme : les signaux du nœud primitif, la souris situs inversus, le syndrome de Kartagener, le flux nodal, et le cordon ombilical."
        show: "Shh · Nodal · Pitx2 · *flux nodal* · cordon"

  - kind: figure
    title: "Des organes asymétriques"
    ref: "S2-2 p.28b"
    fig: "S2-2:28b"
    beats:
      - say: "Plusieurs structures anatomiques présentent une asymétrie gauche-droite : le cœur, les poumons, le foie, le pancréas, l'estomac, l'intestin."
        mark: "asymétrie gauche-droite"
        show: "Cœur · poumons · foie · pancréas · estomac · intestin"

  - kind: figure
    title: "La cascade gauche"
    ref: "S2-2 p.29h"
    fig: "S2-2:29h"
    trap: "Selon le cours : Shh PLUS CONCENTRÉ À GAUCHE → Nodal → Nodal + Lefty2 → Pitx2 (facteur de transcription)."
    beats:
      - say: "L'asymétrie est induite *dès la gastrulation*, par des signaux asymétriques provenant du *nœud primitif*."
        mark: ["dès la gastrulation", "nœud primitif"]
        show: "Dès la *gastrulation* · signaux du *nœud primitif*"
      - say: "Selon le cours, le facteur sécrété *Shh*, Sonic hedgehog, est plus concentré à gauche. Shh induit *Nodal* dans la partie gauche du nœud."
        mark: ["Shh (Sonic hedgehog)", "Nodal partie gauche"]
        show: "*Shh* plus concentré à *gauche* → *Nodal* (gauche du nœud)"
      - say: "Nodal induit Nodal, par une boucle de rétroaction, et *Lefty2*, dans le mésoderme gauche. Enfin, Nodal et Lefty2 induisent *Pitx2*, un facteur de transcription."
        mark: ["Lefty2", "Pitx2"]
        show: "Nodal → Nodal (boucle) + *Lefty2* → *Pitx2* (facteur de transcription)"

  - kind: figure
    title: "La souris situs inversus"
    ref: "S2-2 p.29b"
    fig: "S2-2:29b"
    trap: "Lrd = apparenté aux DYNÉINES (mouvements ciliaires)."
    beats:
      - say: "Comment les facteurs se répartissent-ils asymétriquement dans le nœud ? Un modèle de souris avec *situs inversus*, organes inversés, porte une mutation dans le gène *Lrd*."
        mark: ["situs inversus", "Lrd"]
        show: "Souris *situs inversus* : mutation de *Lrd*"
      - say: "Lrd est apparenté aux *dynéines*, des protéines motrices impliquées dans les mouvements ciliaires."
        mark: "Dynéines"
        show: "Lrd ≈ *dynéines* (mouvements *ciliaires*)"

  - kind: figure
    title: "Le syndrome de Kartagener"
    ref: "S2-2 p.30h"
    fig: "S2-2:30h"
    beats:
      - say: "Chez l'homme, le *syndrome de Kartagener* associe un situs inversus, des pathologies respiratoires dues à une dyskinésie ciliaire, et une motilité réduite des spermatozoïdes."
        mark: ["Kartagener", "dyskinésie ciliaire"]
        show: "*Kartagener* : situs inversus · dyskinésie ciliaire · spermatozoïdes peu mobiles"
      - say: "C'est une maladie génétique à transmission *récessive*, due à des mutations dans des gènes de dynéines."
        mark: "récessive"
        show: "Transmission *récessive* · gènes de *dynéines*"

  - kind: figure
    title: "La théorie du flux nodal"
    ref: "S2-2 p.30b"
    fig: "S2-2:30b"
    trap: "SEULES les cellules CENTRALES expriment Lrd ; flux vers la GAUCHE."
    beats:
      - say: "Dans le nœud primitif, des *monocils* sont présents à la surface des cellules."
        mark: "monocils"
        show: "Nœud primitif : *monocils*"
      - say: "Seules les cellules *centrales* expriment Lrd, qui actionne un mouvement *circulaire* des cils, entraînant un *flux vers la gauche*. C'est la *théorie du flux nodal*."
        mark: ["cellules centrales", "flux vers la gauche"]
        show: "Cellules *centrales* : Lrd → rotation des cils → flux *vers la gauche* = *flux nodal*"

  - kind: figure
    title: "Le flux nodal"
    ref: "S2-2 p.31h"
    fig: "S2-2:31h"
    beats:
      - say: "Les monocils actifs au centre du nœud créent un flux de morphogènes, *Shh* et *acide rétinoïque*, vers la gauche."
        mark: ["Shh et RA", "vers la gauche"]
        show: "Monocils centraux → flux de *Shh* et *RA* → *gauche*"

  - kind: flow
    title: "De la rotation des cils à Pitx2"
    ref: "S2-2 p.29-31"
    beats:
      - say: "La chaîne complète."
      - say: "Lrd, une dynéine, fait tourner les monocils centraux."
        show: "*Lrd* (dynéine) → rotation des monocils"
      - say: "Le flux nodal pousse Shh et l'acide rétinoïque vers la gauche."
        show: "Flux nodal → Shh, RA *à gauche*"
      - say: "Shh induit Nodal à gauche, puis Nodal et Lefty2."
        show: "Shh → *Nodal* → Nodal + *Lefty2*"
      - say: "Et Pitx2, facteur de transcription, programme le côté gauche."
        show: "→ *Pitx2* : identité *gauche*"

  - kind: figure
    title: "Le cordon ombilical"
    ref: "S2-2 p.31b"
    fig: "S2-2:31b"
    trap: "Cordon = amnios + conduit vitellin + pédicule de connexion (+ vaisseaux)."
    beats:
      - say: "À terme, la cavité amniotique entourera complètement l'embryon. Le conduit vitellin et le pédicule de connexion s'allongent et sont entièrement recouverts par l'amnios, qui forme une gaine."
        mark: ["entourera complètement", "gaine"]
        show: "Amnios → entoure tout · *gaine* autour du conduit vitellin + pédicule"
      - say: "L'amnios, le conduit vitellin, et le pédicule de connexion, avec ses vaisseaux sanguins, forment le *cordon ombilical*. Figure à la dixième semaine."
        mark: ["Cordon ombilical", "Sem 10"]
        show: "# Amnios + conduit vitellin + pédicule (vaisseaux) = *cordon ombilical*"

  - kind: figure
    title: "L'embryon de 4 semaines"
    ref: "S2-2 p.32h"
    fig: "S2-2:32h"
    trap: "Après 4 semaines : pas plus de 5 mm."
    beats:
      - say: "Après quatre semaines, l'embryon prend une forme qui laisse présager l'apparence de l'individu à venir. À ce stade, il ne mesure *pas plus de cinq millimètres*."
        mark: ["4 semaines", "5 mm"]
        show: "*4 semaines* · *≤ 5 mm*"
      - say: "Sur cette image de microscopie électronique à balayage, la cavité amniotique a été enlevée, mais la vésicule vitelline a été préservée."
        mark: "microscopie électronique"
        show: "MEB : amnios enlevé · vésicule vitelline conservée"

  - kind: trap
    title: "Les pièges"
    ref: "S2-2 p.29-32"
    beats:
      - say: "Trois pièges."
      - say: "“Pitx2 est un morphogène sécrété” : faux, c'est un facteur de transcription."
        show: "✓ *Pitx2* = facteur de transcription"
      - say: "“Toutes les cellules du nœud expriment Lrd” : faux, seulement les cellules centrales."
        show: "✓ Lrd : cellules *centrales*"
      - say: "“Le syndrome de Kartagener est dominant” : faux, récessif."
        show: "✓ Kartagener : *récessif* (dynéines)"

  - kind: mnemo
    title: "Mémoriser la cascade"
    ref: "S2-2 p.29h"
    beats:
      - say: "La cascade gauche en quatre mots : “Sonic Nage Lentement à Gauche”. Shh, Nodal, Lefty2, Pitx2… et le tout à gauche."
        show: "*S*onic *N*age *L*entement … à *G*auche → Shh · Nodal · Lefty2 · Pitx2"

  - kind: quiz
    title: "Quiz express"
    ref: "S2-2 p.30b"
    question: "Dans quel sens le mouvement des monocils du nœud entraîne-t-il le flux nodal ?"
    options:
      - "Vers la droite"
      - "Vers la gauche"
      - "Vers le crânial"
      - "Vers le caudal"
    answer: [1]
    beats:
      - say: "Quiz : dans quel sens va le flux nodal ?"
        countdown: 4
      - say: "Vers la gauche."
        reveal: true

  - kind: outro
    title: "Épisode 56 : organogenèse et poumons"
    ref: "S2-2 p.32b"
    big: "Poumons"
    beats:
      - say: "Prochain épisode : les principes de l'organogenèse, et le développement des poumons."
        show: "Organogenèse · *bronches et alvéoles*"

recap:
  - "Organes asymétriques : cœur, poumons, foie, pancréas, estomac, intestin. Asymétrie induite dès la gastrulation par des signaux asymétriques du nœud primitif : Shh (Sonic hedgehog) plus concentré à gauche → Nodal (partie gauche du nœud) → Nodal (boucle de rétroaction) et Lefty2 (mésoderme gauche) → Nodal + Lefty2 → Pitx2 (facteur de transcription)."
  - "Souris situs inversus : mutation du gène Lrd, apparenté aux dynéines (protéines motrices des mouvements ciliaires). Syndrome de Kartagener : situs inversus, pathologies respiratoires (dyskinésie ciliaire), motilité réduite des spermatozoïdes ; transmission récessive ; mutations dans des gènes de dynéines."
  - "Théorie du flux nodal : monocils à la surface des cellules du nœud ; seules les cellules centrales expriment Lrd, qui actionne un mouvement circulaire des cils → flux vers la gauche ; flux de morphogènes (Shh et RA) vers la gauche."
  - "Cordon ombilical : la cavité amniotique entourera complètement l'embryon ; conduit vitellin et pédicule de connexion allongés, recouverts par l'amnios (gaine) ; amnios + conduit vitellin + pédicule de connexion (et vaisseaux) = cordon ombilical (figure sem. 10). Après 4 semaines : forme annonçant l'individu, pas plus de 5 mm (MEB : amnios enlevé, vésicule vitelline préservée)."

traps:
  - ["Asymétrie induite à l'organogenèse", "Dès la gastrulation", "p.29h"]
  - ["Shh plus concentré à droite", "Selon le cours : plus concentré à gauche", "p.29h"]
  - ["Pitx2 = morphogène", "Facteur de transcription", "p.29h"]
  - ["Lrd = kinésine", "Apparenté aux dynéines", "p.29b"]
  - ["Kartagener dominant", "Transmission récessive", "p.30h"]
  - ["Toutes les cellules du nœud expriment Lrd", "Seules les cellules centrales", "p.30b"]
  - ["Embryon de 4 semaines : 5 cm", "Pas plus de 5 mm", "p.32h"]

mnemonics:
  - ["Cascade", "« Sonic Nage Lentement… à Gauche » : Shh, Nodal, Lefty2, Pitx2", "Pitx2 = facteur de transcription"]
  - ["Cordon", "« A-C-P » : Amnios + Conduit vitellin + Pédicule (vaisseaux)", "Gaine d'amnios"]

quiz:
  - q: "Signaux asymétriques :"
    props:
      - ["L'asymétrie gauche-droite est induite dès la gastrulation.", true, "p.29h."]
      - ["Selon le cours, Shh est plus concentré à gauche.", true, "p.29h."]
      - ["Nodal induit Lefty2 dans le mésoderme gauche.", true, "p.29h."]
      - ["Pitx2 est un facteur de transcription.", true, "p.29h."]
