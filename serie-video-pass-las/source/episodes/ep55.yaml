  - q: "Cils et flux nodal :"
    props:
      - ["La souris situs inversus porte une mutation dans le gène Lrd.", true, "p.29b."]
      - ["Lrd est apparenté aux dynéines.", true, "p.29b."]
      - ["Le syndrome de Kartagener est à transmission dominante.", false, "Récessive."]
      - ["Seules les cellules centrales du nœud expriment Lrd.", true, "p.30b."]
      - ["Le flux nodal entraîne Shh et RA vers la gauche.", true, "p.31h."]
  - q: "Cordon et embryon de 4 semaines :"
    props:
      - ["Le cordon ombilical comprend l'amnios, le conduit vitellin et le pédicule de connexion.", true, "p.31b."]
      - ["Le pédicule de connexion contient des vaisseaux sanguins.", true, "p.31b."]
      - ["La cavité amniotique entourera complètement l'embryon.", true, "p.31b."]
      - ["Après 4 semaines, l'embryon mesure environ 5 cm.", false, "Pas plus de 5 mm."]
      - ["Le syndrome de Kartagener réduit la motilité des spermatozoïdes.", true, "p.30h."]

