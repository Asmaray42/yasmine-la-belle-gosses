  - ["5 stades de la prophase 1", "« Léon Zoo Passe Dimanche Dîner »", "Leptotène · Zygotène · Pachytène · Diplotène · Diacinèse"]
  - ["Sens des stades", "Zygo = s'unir (appariement) ; pachy = croisement ; diplo = double encore accroché (chiasmas)", "Appariement · crossing-over · chiasmas"]

