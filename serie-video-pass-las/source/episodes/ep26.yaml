  - ["Complexe synaptonémal persistant jusqu'à la diacinèse", "Disparaît au diplotène ; les chiasmas subsistent", "p.45, p.47h"]
  - ["X et Y non appariés", "Appariés par les régions pseudoautosomales", "p.46b"]
  - ["± 5 crossing-over par cellule", "± 50", "p.47h"]
  - ["Fuseau de méiose 2 parallèle au premier", "Perpendiculaire", "p.48"]
  - ["Méiose 1 : microtubules sur les deux faces", "Méiose 1 : un seul côté ; méiose 2 : deux faces", "p.49h"]

