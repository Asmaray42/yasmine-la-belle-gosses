  - ["ARN = désoxyribose", "ARN = ribose ; ADN = désoxyribose", "p.42b"]
  - ["T dans l'ARN", "U remplace T dans l'ARN", "p.43h, 44b"]
  - ["Liaison entre 5' et 5'", "OH en 3' + phosphate en 5' (phosphodiester)", "p.43b"]
  - ["Brins parallèles", "Complémentaires et antiparallèles", "p.44h"]
  - ["A–C, G–T", "A–T, C–G (règle stricte)", "p.44h"]
  - ["ARN stable", "ARN fragile ; ADN grande stabilité", "p.45h"]
  - ["3,2 millions de bp", "3,2 milliards de bp", "p.45b"]
  - ["ATP = transport d'électrons", "ATP = monnaie d'énergie ; NAD+ et FAD = transport d'électrons", "p.46h"]

mnemonics:
  - ["Appariement des bases", "« AT-CG » : A Tient, C Garde", "A–T, C–G"]
  - ["Désoxyribose", "« dés-oxy » = il manque un oxygène : le sucre de l'ADN", "Désoxyribose (ADN) · ribose (ARN)"]
  - ["U ou T", "U pour Une seule chaîne (ARN simple brin)", "U dans l'ARN, T dans l'ADN"]

quiz:
  - q: "À propos des nucléotides :"
    props:
      - ["Un nucléotide comprend un sucre à 5 carbones, un phosphate et une base azotée.", true, "p.42b."]
      - ["Il existe cinq bases azotées différentes.", true, "A, G, C, T, U."]
      - ["L'uracile se trouve dans l'ADN.", false, "Il se trouve dans l'ARN."]
      - ["La liaison phosphodiester relie l'OH en 3' au phosphate en 5' du nucléotide suivant.", true, "p.43b."]
      - ["La chaîne commence par un OH en 5'.", false, "Elle commence par un phosphate en 5' et se termine par un OH en 3'."]
  - q: "À propos de l'ADN et de l'ARN :"
    props:
      - ["Les deux brins de l'ADN sont complémentaires et antiparallèles.", true, "p.44h."]
      - ["La règle d'appariement est A avec T et C avec G.", true, "p.44h."]
      - ["L'ARN présente une structure en double hélice.", false, "Simple brin, pas d'hélice."]
      - ["L'ARN est fragile, avec un temps de vie assez court.", true, "p.45h."]
      - ["L'unité de longueur de l'ADN est la paire de bases.", true, "bp."]
  - q: "ADN humain et autres nucléotides :"
    props:
      - ["L'ADN humain comprend 23 molécules différentes.", true, "Les chromosomes."]
      - ["Un chromosome humain mesure entre 48 et 250 millions de paires de bases.", true, "p.45b."]
      - ["L'ADN humain total compte 3,2 milliards de paires de bases.", true, "p.45b."]
      - ["L'ATP sert au transport d'électrons.", false, "Monnaie d'échange d'énergie ; NAD+ et FAD transportent les électrons."]
      - ["Le FAD est la flavine adénine dinucléotide.", true, "p.46h."]

