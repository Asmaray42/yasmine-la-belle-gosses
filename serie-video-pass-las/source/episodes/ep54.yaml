  - ["Allantoïde = ectoderme", "Extension de l'endoderme ; une partie → vessie", "p.26h"]
  - ["Mésoderme intermédiaire dans la tête", "Pas présent dans la tête", "p.27"]
  - ["Muscles des membres = lame latérale", "Muscles = somites ; os/articulations = lame latérale", "p.28h"]

mnemonics:
  - ["Pleures", "Somato = paroi (corps) ; splanchno = viscères ; entre = cœlome", "Lame latérale"]
  - ["Membres", "Somites bougent (muscles), lame latérale tient (os, articulations)", "Tableau p.28h"]
  - ["Endoderme", "« Tubes et glandes » : digestif, respiratoire, pharynx + foie, pancréas, thyroïde", "Liste non exhaustive"]

