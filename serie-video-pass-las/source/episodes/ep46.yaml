      - ["Les mitochondries du spermatozoïde sont rapidement détruites.", true, "p.18h."]
      - ["La méiose 2 s'achève environ 2 heures après la fusion.", true, "p.18h."]
      - ["Le pronucleus paternel se forme du côté des globules polaires.", false, "Côté point d'entrée du spermatozoïde."]
      - ["Chromosomes paternels et maternels se placent sur le même fuseau.", true, "p.18b."]

