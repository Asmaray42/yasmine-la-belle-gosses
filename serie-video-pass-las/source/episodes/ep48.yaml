  - ["Cytotrophoblaste = couche externe invasive", "Syncytio = externe, hCG, invasif ; cyto = interne, prolifère", "p.22b"]
  - ["Endomètre → chorion", "Endomètre → déciduale (réaction déciduale)", "p.22b"]
  - ["Trou bouché par l'amnios", "Par un caillot de fibrine", "p.22b"]
  - ["Amnios issu de l'hypoblaste", "Issu de l'épiblaste", "p.23h"]
  - ["Lécithocèle primaire = vésicule ombilicale", "Primaire = cavité exocœlomique ; secondaire = vésicule ombilicale", "p.23b, 24h"]
  - ["Villosités secondaires vascularisées", "Tertiaires = vaisseaux", "p.25h"]
  - ["Le cœur bat au jour 28", "Jour 22", "p.25h"]

mnemonics:
  - ["Villosités", "1 cyto · 2 + mésoderme · 3 + vaisseaux", "Cœur J22"]
  - ["Lécithocèles", "Primaire = premier creusé (exocœlome, Heuser) ; secondaire = vésicule ombilicale", "Tous deux issus de l'hypoblaste"]
  - ["Filtre", "« En Mé Cy Sy » : Endothélium, Mésoderme, Cyto, Syncytio", "4 couches"]

