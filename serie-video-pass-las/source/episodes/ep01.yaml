quiz:
  - q: "Selon le cours, parmi les propositions suivantes, laquelle ou lesquelles sont exactes ?"
    props:
      - ["Le cours énumère sept caractéristiques des êtres vivants.", true, "La diapo p.4b liste 7 puces."]
      - ["Croissance, développement et reproduction y constituent trois caractéristiques distinctes.", false, "C'est une seule puce, donc une seule caractéristique."]
      - ["L'homéostasie fait partie des caractéristiques des êtres vivants.", true, "6e caractéristique."]
      - ["La « complexité aléatoire » fait partie des caractéristiques des êtres vivants.", false, "Le cours dit complexité ordonnée."]
      - ["L'adaptation évolutive fait partie des caractéristiques des êtres vivants.", true, "7e caractéristique."]
  - q: "D'après le schéma de l'organisation hiérarchisée des êtres vivants (p.5) :"
    props:
      - ["L'organite se situe entre la macromolécule et la cellule.", true, "… macromolécule → organite → cellule …"]
      - ["La cytologie est la discipline placée sous le niveau du tissu.", false, "Sous le tissu, c'est l'histologie ; la cytologie est sous l'organite et la cellule."]
      - ["Le système d'organes se situe entre l'organe et l'organisme.", true, "… organe → système d'organes → organisme."]
      - ["La flèche « physiologie » s'étend du niveau du tissu jusqu'à celui de l'organisme.", true, "C'est l'étendue de la flèche sur le schéma."]
      - ["La biochimie est la discipline placée sous le niveau des atomes.", false, "Sous les atomes et la molécule : chimie organique ; la biochimie est sous la macromolécule."]
  - q: "À propos de la théorie cellulaire présentée p.5 :"
    props:
      - ["Un organisme humain compte entre 10.000 et 100.000 milliards de cellules.", true, "Chiffre du tableau de la p.5b (milliards)."]
      - ["Le ver C. elegans compte 959 cellules.", true, "Chiffre exact du tableau."]
      - ["Elle admet une génération spontanée de cellules dans certaines conditions.", false, "Le cours précise : pas de génération spontanée."]
      - ["Les stades 1-cell, 2-cell, 4-cell, 8-cell, morula et blastocyste illustrent l'énoncé « toutes les cellules proviennent d'une cellule préexistante ».", true, "C'est l'illustration du 2e énoncé."]
      - ["Une bactérie est un organisme constitué de plusieurs cellules.", false, "Le tableau donne 1 cellule par organisme pour les bactéries."]
  - q: "À propos des thèmes 2, 3 et 4 :"
    props:
      - ["L'ADN est formé de deux longues chaînes de nucléotides.", true, "« 2 longues chaînes de nucléotides » (p.6h)."]
      - ["Les quatre nucléotides de l'ADN sont A, C, G et U.", false, "ADN = A, C, G, T (p.6h)."]
      - ["L'ADN est répliqué avant chaque division cellulaire.", true, "« Réplication de l'ADN avant chaque division cellulaire » (p.6h)."]
      - ["Le traitement de l'information venant de l'environnement est essentiel pour l'organisation tissulaire, l'intégration de stimulus et l'homéostasie.", true, "Les trois éléments listés p.6b."]
      - ["Les systèmes vivants sont dans un état d'équilibre qui ne nécessite qu'un apport ponctuel d'énergie.", false, "Non-équilibre, apport constant d'énergie (p.7h)."]
  - q: "À propos de la diversité du vivant et de Naegleria Floweri :"
    props:
      - ["Les archées et les bactéries sont les deux domaines que le cours regroupe sous le terme de procaryotes.", true, "« D1 et D2 : procaryotes » (p.7b)."]
      - ["Les protistes sont des procaryotes.", false, "Les protistes forment le règne R4 du domaine D3 : ce sont des eucaryotes."]
      - ["Le domaine des eucaryotes comprend quatre règnes : plantes, champignons, animaux et protistes.", true, "R1 à R4 (p.7b)."]
      - ["L'ancêtre commun, unicellulaire, vivait il y a environ 3,8 millions d'années.", false, "~3,8 milliards d'années (p.8b)."]
      - ["Naegleria Floweri pénètre dans l'organisme par ingestion d'eau contaminée.", false, "Le cours indique : par les muqueuses nasales (p.8h)."]

