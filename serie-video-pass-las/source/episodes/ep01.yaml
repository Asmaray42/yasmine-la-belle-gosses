title: "Vivant ou pas vivant ?"
subtitle: "7 caractéristiques · 9 niveaux · 5 thèmes unificateurs"
source: "S1-1 p.1 à 8"
chapter: "Partie I — Chapitre I. La Biologie, la science de la vie"
objectives:
  - "Situer le cours WMEDE1152 : ses deux parties, son organisation et ses supports."
  - "Expliquer le schéma physique / chimie / biologie (p.3)."
  - "Réciter les 7 caractéristiques des êtres vivants avec les intitulés exacts du cours."
  - "Ordonner les 9 niveaux de l'organisation hiérarchisée et placer les 7 disciplines."
  - "Énoncer les 5 thèmes unificateurs avec leurs sous-points et leurs chiffres."
  - "Distinguer domaine et règne, procaryotes et eucaryotes, et lire l'arbre du vivant."
  - "Décrire Naegleria Floweri : nature, milieu, porte d'entrée, cible, conséquence."

scenes:
  - kind: hook
    title: "Un feu, ça grandit… alors c'est vivant ?"
    ref: "S1-1 p.4-8"
    big: "VIVANT ?"
    beats:
      - say: "Un feu, ça grandit, ça consomme de l'oxygène, ça peut même se multiplier en projetant des étincelles. Alors, un feu, c'est vivant ?"
      - say: "Non. Et à l'examen de janvier, “je sens que non”, ça ne suffit pas : il te faut les critères *exacts* du cours."
        show: "Il te faut les critères *exacts* du cours"
      - say: "Dans cet épisode, on verrouille la checklist du vivant : *sept* caractéristiques, *neuf* niveaux d'organisation, *cinq* thèmes unificateurs."
        show: "*7* caractéristiques · *9* niveaux · *5* thèmes"
      - say: "Et en bonus, une amibe qui s'attaque au cerveau. On y va."
        show: "+ une amibe qui s'attaque au cerveau"

  - kind: intro
    title: "Le cours en une minute"
    ref: "S1-1 p.1-2"
    trap: "Pas de piège d'examen : organisation du cours."
    beats:
      - say: "Le cours WMEDE1152, “Biologie et Embryologie générale”, est donné par le professeur Charles De Smet. Il a deux parties."
        show: "WMEDE1152 · Prof. *Charles De Smet*"
      - say: "La première partie va *des molécules jusqu'aux cellules* : c'est le fonctionnement. La deuxième va *des cellules jusqu'à l'organisme* : c'est le développement embryonnaire."
        show: "Partie I : des molécules jusqu'aux cellules (*fonctionnement*) · Partie II : des cellules jusqu'à l'organisme (*développement embryonnaire*)"
      - say: "Les séances de travaux pratiques, avec rapports et interros, sont *obligatoires*. Une interrogation sur la matière vue a lieu vers le premier novembre : elle est *non cotée*. Les monitorats de révision se font sur inscription."
        show: "! TP (rapports & interros) *obligatoires* · interro ~1er novembre *non cotée* · monitorats sur inscription"
      - say: "Pour être informé, inscris-toi sur Moodle, dans “mon bureau, mes études”, et utilise les forums pour tes questions sur la matière ou l'organisation."
        show: "Moodle (mon bureau / mes études) + forums"
      - say: "Tes supports : tes notes de cours, les dias largement annotées, c'est-à-dire le syllabus CIB pour la partie 1 et les PDF sur Moodle, et les feuilles d'acquis. Les livres de référence : “Biologie” de Raven et “Embryologie humaine” de Larsen, chez De Boeck."
        show: "Notes · dias annotées (syllabus CIB, PDF Moodle) · *feuilles d'acquis* · Raven & Larsen (De Boeck)"
      - say: "Enfin, les EPI, les exercices personnels d'intégration : on part d'articles de type case report, puis on met en commun en auditoire."
        show: "EPI : articles « case report », mise en commun en auditoire"

  - kind: figure
    title: "Matière inanimée vs système vivant"
    ref: "S1-1 p.3"
    fig: "S1-1:3b"
    trap: "Formulations exactes : inanimé = assemblage « simple » d'éléments, atomes ; vivant = organisation plus complexe de la matière."
    beats:
      - say: "Premier schéma de la partie un. À gauche, les *matières inanimées* : le cours les décrit comme un assemblage “simple” d'éléments, d'atomes."
        focus: [0.0, 0.25, 0.5, 0.95]
        mark: "assemblage"
        show: "Matières inanimées = assemblage *« simple »* d'éléments, atomes"
      - say: "À droite, les *systèmes vivants* : une organisation *plus complexe* de la matière."
        focus: [0.5, 0.25, 1.0, 0.95]
        mark: "organisation"
        show: "Systèmes vivants = organisation *plus complexe* de la matière"
      - say: "Trois étiquettes : physique, à côté du soleil ; chimie, sous la flèche qui va de l'inanimé vers le vivant ; biologie, sur le cercle du vivant. Et du soleil descend une flèche : l'énergie."
        focus: "all"
        mark: ["physique", "chimie", "biologie", "énergie"]
        show: "physique · chimie · biologie · *énergie*"
      - say: "Retiens l'idée : le vivant, c'est de la matière organisée de façon plus complexe, et cette organisation a besoin d'énergie. On la retrouvera dans le thème quatre."

  - kind: list
    title: "Les 7 caractéristiques des êtres vivants"
    ref: "S1-1 p.4"
    trap: "Les adjectifs font partie de l'intitulé : organisation cellulaire, complexité ordonnée, adaptation évolutive."
    beats:
      - say: "Le chapitre un s'appelle “La Biologie, la science de la vie”, en trois points : les caractéristiques des êtres vivants, l'organisation hiérarchisée, et les thèmes unificateurs. On commence par les caractéristiques : le cours en donne *sept*. Retiens ces mots-là, exactement."
      - say: "Un : organisation cellulaire."
        show: "1. Organisation *cellulaire*"
      - say: "Deux : complexité ordonnée."
        show: "2. Complexité *ordonnée*"
      - say: "Trois : sensibilité."
        show: "3. Sensibilité"
      - say: "Quatre : croissance, développement et reproduction."
        show: "4. Croissance, développement *et* reproduction"
      - say: "Cinq : utilisation d'énergie."
        show: "5. Utilisation d'énergie"
      - say: "Six : homéostasie."
        show: "6. Homéostasie"
      - say: "Sept : adaptation évolutive."
        show: "7. Adaptation *évolutive*"

  - kind: mnemo
    title: "Le hamster qui coche les 7 cases"
    ref: "S1-1 p.4"
    phrase: "*O*n *C*herche *S*ept *C*ritères : *U*n *H*amster *A*daptable"
    trap: "Le mnémo suit l'ordre du cours ; « Croissance, développement et reproduction » = une seule lettre, un seul critère."
    beats:
      - say: "Pour les retenir, une phrase et une image. La phrase : “On Cherche Sept Critères : Un Hamster Adaptable.” Et l'image : ton hamster, qui coche chaque case."
      - say: "O : il est fait de cellules, c'est l'organisation cellulaire."
        show: "*O* — Organisation cellulaire : il est fait de cellules"
      - say: "C : son corps est structuré, rangé, c'est la complexité ordonnée."
        show: "*C* — Complexité ordonnée : un corps structuré, rangé"
      - say: "S : il sursaute quand tu tapes sur la cage, c'est la sensibilité."
        show: "*S* — Sensibilité : il sursaute au bruit"
      - say: "C : il grandit, il se développe et il fait des petits, c'est croissance, développement et reproduction, un seul critère."
        show: "*C* — Croissance, développement et reproduction : il grandit et fait des petits"
      - say: "U : il mange ses graines pour fonctionner, c'est l'utilisation d'énergie."
        show: "*U* — Utilisation d'énergie : il mange ses graines"
      - say: "H : son milieu intérieur reste stable, c'est l'homéostasie."
        show: "*H* — Homéostasie : un milieu intérieur stable"
      - say: "A : au fil des générations, son espèce évolue, c'est l'adaptation évolutive."
        show: "*A* — Adaptation évolutive : son espèce évolue au fil des générations"

  - kind: trap
    title: "Le piège du comptage"
    ref: "S1-1 p.4"
    trap: "7 caractéristiques ; « croissance, développement et reproduction » n'en forme qu'une ; complexité ordonnée, adaptation évolutive."
    beats:
      - say: "Attention, piège classique."
      - say: "“Le cours liste neuf caractéristiques” : faux."
        show: "✗ « Le cours liste 9 caractéristiques »"
      - say: "Il y en a sept, et “croissance, développement et reproduction” n'en forme qu'*une*."
        show: "✓ *7* caractéristiques : croissance, développement et reproduction = *1 seule*"
      - say: "Et surveille les adjectifs : on dit complexité *ordonnée*, adaptation *évolutive*. Une proposition qui parle de complexité aléatoire ne reprend pas le cours."
        show: "✓ Complexité *ORDONNÉE* · adaptation *ÉVOLUTIVE*"

  - kind: quiz
    title: "Quiz express n°1"
    ref: "S1-1 p.4"
    question: "Selon le cours, quelle proposition est exacte ?"
    options:
      - "Le cours liste neuf caractéristiques des êtres vivants."
      - "« Croissance, développement et reproduction » forment une seule caractéristique."
      - "La « complexité aléatoire » fait partie des caractéristiques."
    answer: [1]
    beats:
      - say: "À toi. Selon le cours, quelle proposition est exacte ? Réponds avant la fin du compte à rebours."
        countdown: 4
      - say: "Réponse B. Croissance, développement et reproduction, c'est une seule caractéristique sur sept. A est faux, il y en a sept. C est faux, c'est complexité ordonnée."
        reveal: true

  - kind: figure
    title: "L'organisation hiérarchisée : 9 niveaux"
    ref: "S1-1 p.5"
    fig: "S1-1:5h"
    trap: "Ordre : l'organite est entre la macromolécule et la cellule ; le système d'organes est entre l'organe et l'organisme."
    beats:
      - say: "Deuxième point du chapitre : l'organisation hiérarchisée des êtres vivants. Le schéma du cours aligne neuf niveaux, du plus petit au plus grand."
        focus: "all"
      - say: "Les atomes. La molécule. La macromolécule, ici une double hélice d'ADN."
        focus: [0.02, 0.26, 0.27, 0.77]
        show: "Atomes → Molécule → Macromolécule"
      - say: "L'organite, une mitochondrie. La cellule, une cellule nerveuse. Ces cinq premiers niveaux forment le *niveau cellulaire*."
        focus: [0.23, 0.26, 0.53, 0.77]
        show: "→ Organite → Cellule = *niveau cellulaire*"
      - say: "Puis le tissu, ici du tissu nerveux, et l'organe, un cerveau."
        focus: [0.5, 0.26, 0.76, 0.77]
        show: "→ Tissu → Organe"
      - say: "Le système d'organes, le système nerveux d'une oie, et l'organisme, l'oie entière : c'est le *niveau de l'organisme*. Le schéma porte aussi des barres d'échelle : 0,2 micromètre, 0,5 micromètre et 100 micromètres."
        focus: [0.72, 0.26, 0.98, 0.77]
        show: "→ Système d'organes → Organisme = *niveau de l'organisme*"

  - kind: mnemo
    title: "Les 9 niveaux, du plus petit au plus grand"
    ref: "S1-1 p.5"
    phrase: "*A*u *M*arché, *M*amie *O*ffre *C*es *T*omates *O*u *S*es *O*ignons"
    trap: "Les deux M = molécule puis macromolécule ; les trois O de la fin = organe, système d'organes, organisme (sans oublier l'organite en 4e position)."
    beats:
      - say: "Pour l'ordre, imagine un zoom arrière, de l'atome jusqu'à l'oie, et une phrase : “Au Marché, Mamie Offre Ces Tomates Ou Ses Oignons.”"
      - say: "A, atomes. M, molécule. M, macromolécule : d'abord la petite, puis la grande."
        show: "*A*tomes · *M*olécule · *M*acromolécule"
      - say: "O, organite. C, cellule."
        show: "*O*rganite · *C*ellule"
      - say: "T, tissu. O, organe. S, système d'organes. O, organisme."
        show: "*T*issu · *O*rgane · *S*ystème d'organes · *O*rganisme"

  - kind: figure
    title: "Quelle discipline pour quel niveau ?"
    ref: "S1-1 p.5"
    fig: "S1-1:5h"
    trap: "Cytologie → organite et cellule ; histologie → tissu ; biochimie → macromolécule ; chimie organique → atomes et molécule."
    beats:
      - say: "Sous ce schéma, le cours place les disciplines. La chimie organique, sous les atomes et la molécule. La biochimie, sous la macromolécule."
        focus: [0.0, 0.62, 0.55, 0.95]
        mark: ["Chimie", "Biochimie"]
      - say: "La cytologie, sous l'organite et la cellule. L'histologie, sous le tissu. L'anatomie, sous l'organe et le système d'organes."
        focus: [0.25, 0.62, 0.85, 0.95]
        mark: ["Cytologie", "Histologie", "Anatomie"]
      - say: "Et deux flèches qui couvrent plusieurs niveaux : la *biologie moléculaire*, de la macromolécule jusqu'à la cellule, et la *physiologie*, du tissu jusqu'à l'organisme."
        focus: [0.1, 0.7, 0.95, 0.95]
        mark: ["Biologie moléculaire", "Physiologie"]

  - kind: table
    title: "Disciplines et niveaux"
    ref: "S1-1 p.5"
    header: ["Discipline", "Niveau(x) sur le schéma"]
    beats:
      - say: "On récapitule."
      - say: "Chimie organique : atomes et molécule."
        show: "Chimie organique | atomes, molécule"
      - say: "Biochimie : macromolécule."
        show: "Biochimie | macromolécule"
      - say: "Cytologie : organite et cellule."
        show: "*Cytologie* | organite, *cellule*"
      - say: "Histologie : tissu."
        show: "*Histologie* | *tissu*"
      - say: "Anatomie : organe et système d'organes."
        show: "Anatomie | organe, système d'organes"
      - say: "Biologie moléculaire : de la macromolécule à la cellule."
        show: "Biologie moléculaire | macromolécule → cellule"
      - say: "Physiologie : du tissu à l'organisme."
        show: "Physiologie | tissu → organisme"

  - kind: trap
    title: "Cyto ou histo ?"
    ref: "S1-1 p.5"
    trap: "Ne jamais inverser cytologie (cellule) et histologie (tissu)."
    beats:
      - say: "Le piège classique : inverser cytologie et histologie."
      - say: "“L'histologie se place au niveau de la cellule” : faux."
        show: "✗ « L'histologie étudie le niveau de la cellule »"
      - say: "La cytologie, c'est la cellule. L'histologie, c'est le tissu. Astuce : cyto, comme cytoplasme, c'est dans la cellule."
        show: "✓ *CYTO*logie = *cellule* · *HISTO*logie = *tissu*"
      - say: "Et la biochimie est sous la macromolécule, pas sous les atomes : sous les atomes, c'est la chimie organique."
        show: "✓ Atomes → *chimie organique* · macromolécule → *biochimie*"

  - kind: quiz
    title: "Quiz express n°2"
    ref: "S1-1 p.5"
    question: "Dans l'organisation hiérarchisée, quel niveau se trouve entre la macromolécule et la cellule ?"
    options:
      - "Le tissu"
      - "L'organite"
      - "La molécule"
      - "Le système d'organes"
    answer: [1]
    beats:
      - say: "Question rapide : quel niveau se trouve entre la macromolécule et la cellule ?"
        countdown: 4
      - say: "L'organite. Atomes, molécule, macromolécule, *organite*, cellule : Au Marché, Mamie *Offre*…"
        reveal: true

  - kind: figure
    title: "Thème 1 : la théorie cellulaire"
    ref: "S1-1 p.5"
    fig: "S1-1:5b"
    trap: "« Une ou plusieurs » cellules ; 1 / 959 / 10.000 à 100.000 milliards ; pas de génération spontanée."
    beats:
      - say: "Troisième point du chapitre : les thèmes unificateurs de la biologie. Il y en a cinq. Thème un : la théorie cellulaire, en deux énoncés."
        focus: "all"
      - say: "Premier énoncé : tous les êtres vivants sont constitués d'*une ou plusieurs* cellules."
        focus: [0.05, 0.25, 0.95, 0.58]
        mark: "Tous les êtres vivants"
        show: "Tous les êtres vivants sont constitués d'*une ou plusieurs* cellules"
      - say: "Les chiffres du cours, en nombre de cellules par organisme : une bactérie, *une* seule cellule ; le ver C. elegans, *959* cellules ; l'humain, entre *10 000 et 100 000 milliards*, illustré par une coupe de peau."
        focus: [0.05, 0.3, 0.95, 0.58]
        mark: ["959", "100.000"]
        show: "# Bactérie : *1* · C. elegans : *959* · Humain : *10.000 – 100.000 milliards*"
      - say: "Deuxième énoncé : toutes les cellules proviennent d'une cellule *préexistante*. Il n'y a *pas de génération spontanée*."
        focus: [0.05, 0.6, 0.95, 0.93]
        mark: "préexistante"
        show: "Toutes les cellules proviennent d'une cellule *préexistante* (pas de génération spontanée)"
      - say: "L'illustration : les premiers stades du développement d'un embryon humain. Une cellule, deux, quatre, huit, puis la morula, puis le blastocyste. Chaque cellule naît d'une cellule qui existait déjà."
        focus: [0.15, 0.68, 0.85, 0.92]
        mark: ["1-cell", "morula", "blastocyste"]

  - kind: trap
    title: "Les chiffres de la théorie cellulaire"
    ref: "S1-1 p.5"
    trap: "Milliards (pas millions) ; 959 exactement ; aucune génération spontanée."
    beats:
      - say: "Trois pièges de chiffres et de mots."
      - say: "“Un humain compte 10 000 à 100 000 millions de cellules” : faux."
        show: "✗ « 10.000 à 100.000 *millions* de cellules »"
      - say: "Ce sont des *milliards* : entre 10 000 et 100 000 milliards. Et pour C. elegans, retiens le chiffre exact : *959*."
        show: "✓ 10.000 à 100.000 *milliards* · C. elegans : *959*"
      - say: "Enfin, toute proposition qui dit qu'une cellule peut apparaître spontanément contredit le cours : pas de génération spontanée."
        show: "✓ Toute cellule vient d'une cellule *préexistante*"
      - say: "Petit complément pour les puissances de dix : 10 000 à 100 000 milliards, c'est 10 puissance 13 à 10 puissance 14."
        show: "[C] 10.000 à 100.000 milliards = 10¹³ à 10¹⁴"

  - kind: figure
    title: "Thème 2 : la base moléculaire de l'hérédité"
    ref: "S1-1 p.6"
    fig: "S1-1:6h"
    trap: "ADN = 2 chaînes, 4 nucléotides A, C, G, T ; réplication AVANT chaque division."
    beats:
      - say: "Thème deux : la base moléculaire de l'hérédité. Le “plan” de la cellule est inscrit dans une longue molécule, l'ADN."
        focus: [0.0, 0.15, 1.0, 0.6]
        mark: "plan"
        show: "Le « plan » de la cellule est inscrit dans une longue molécule : l'*ADN*"
      - say: "L'acide désoxyribonucléique : *deux* longues chaînes de nucléotides, *quatre* nucléotides, A, C, G et T, et la *séquence* des nucléotides, c'est l'information."
        focus: [0.2, 0.25, 1.0, 0.6]
        mark: ["2 longues", "4 nucléotides", "séquence des nucléotides"]
        show: "*2* longues chaînes · *4* nucléotides (A, C, G, T) · séquence = *information*"
      - say: "Deuxième message : la continuité de la vie, l'hérédité, dépend de la transmission de l'ADN. Par la réplication de l'ADN *avant* chaque division cellulaire, et par la transmission d'une génération à l'autre."
        focus: [0.0, 0.6, 1.0, 0.95]
        mark: ["avant chaque division", "génération"]
        show: "Réplication de l'ADN *avant* chaque division · transmission d'une génération à l'autre"

  - kind: figure
    title: "Thème 3 : les cellules traitent l'information"
    ref: "S1-1 p.6"
    fig: "S1-1:6b"
    trap: "Deux sources d'information (ADN et environnement) ; trois domaines où c'est essentiel."
    beats:
      - say: "Thème trois : les cellules sont des systèmes de traitement de l'information, dans deux directions."
        focus: "all"
      - say: "Vers l'intérieur : elles synthétisent les composants cellulaires selon l'information stockée dans l'*ADN*."
        mark: "Synthétisent"
        show: "Synthèse des composants selon l'information de l'*ADN*"
      - say: "Vers l'extérieur : elles traitent l'information venant de leur *environnement*."
        mark: "environnement"
        show: "Traitement de l'information de l'*environnement*"
      - say: "C'est essentiel pour trois choses : l'organisation tissulaire, l'intégration de stimulus, avec sensibilité et mouvement, et l'homéostasie. Tu reconnais deux caractéristiques du vivant : sensibilité et homéostasie."
        mark: ["organisation tissulaire", "intégration de stimulus", "homéostasie"]
        show: "Essentiel pour : organisation tissulaire · intégration de stimulus (sensibilité, mouvement…) · *homéostasie*"

  - kind: figure
    title: "Thème 4 : le vivant, hors équilibre"
    ref: "S1-1 p.7"
    fig: "S1-1:7h"
    trap: "Non-équilibre ; apport CONSTANT d'énergie ; à tous les niveaux jusqu'à la population."
    beats:
      - say: "Thème quatre : les systèmes vivants sont dans un état de *non-équilibre*. Regarde le schéma : à gauche, à l'équilibre, des billes de trois couleurs éparpillées au hasard."
        focus: [0.0, 0.15, 0.6, 0.75]
        mark: "équilibre"
      - say: "Avec un apport d'énergie, à droite, les mêmes billes s'assemblent en chaînes, en anneaux, en structures organisées : c'est le non-équilibre."
        focus: [0.35, 0.15, 1.0, 0.75]
        mark: ["énergie", "non-équilibre"]
        show: "Énergie → billes organisées = *non-équilibre*"
      - say: "Deux points à retenir. Un : c'est vrai à *tous les niveaux*, molécules, cellules, organisme, population. Deux : cela nécessite un apport *constant* d'énergie."
        focus: [0.0, 0.6, 1.0, 1.0]
        mark: ["tous les niveaux", "constant"]
        show: "À tous les niveaux : molécules, cellules, organisme, *population* · apport *constant* d'énergie"

  - kind: trap
    title: "ADN, réplication, énergie"
    ref: "S1-1 p.6-7"
    trap: "A, C, G, T ; avant la division ; non-équilibre ; apport constant."
    beats:
      - say: "Trois pièges sur les thèmes deux à quatre."
      - say: "“Les quatre nucléotides de l'ADN sont A, C, G et U” : faux. C'est A, C, G et *T*."
        show: "✗ ADN = A, C, G, U  →  ✓ ADN = A, C, G, *T*"
      - say: "“La réplication a lieu après la division” : faux. *Avant* chaque division : il faut copier le plan avant de le partager."
        show: "✓ Réplication *AVANT* chaque division cellulaire"
      - say: "“Le vivant est à l'équilibre, avec un apport ponctuel d'énergie” : faux. *Non*-équilibre, et apport *constant*."
        show: "✓ *NON*-équilibre · apport *CONSTANT* d'énergie"

  - kind: figure
    title: "Thème 5 : domaines et règnes"
    ref: "S1-1 p.7"
    fig: "S1-1:7b"
