  - ["Ectoderme = hypoblaste restant", "Ce qui reste de l'épiblaste", "p.5b"]
  - ["Neurulation induite par la notochorde seule", "Selon la diapo : induite par le nœud primitif", "p.5b"]
  - ["Fermeture débute aux extrémités", "Débute au J22 dans la partie médiane", "p.6b"]
  - ["Neuropore caudal fermé avant le crânial", "Crânial J24-25, caudal J26", "p.6b"]
  - ["Anencéphalie = neuropore caudal", "Neuropore crânial (1/5000)", "p.7b"]
  - ["Spina bifida = neuropore crânial", "Portion médiane du neurotube (1/2000)", "p.7b"]
  - ["Notochorde → corps vertébraux", "Intégrée dans les disques intervertébraux ; inducteur des corps vertébraux", "p.8h"]
  - ["Processus notochordal = tige pleine", "Tube creux ; la notochorde finale est une tige pleine", "p.8b-9h"]

mnemonics:
  - ["Crête neurale", "« MEFO » : Mélanocytes, Entérique, Face, Odontoblastes", "TEM au niveau des plis"]
  - ["Neuropores", "22 début (milieu) · 24-25 tête · 26 queue", "Anencéphalie = tête"]
  - ["Notochorde", "« Processus creux → plaque → tige pleine »", "Canal neurentérique transitoire"]

