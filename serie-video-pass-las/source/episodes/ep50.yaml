title: "Neurulation, crête neurale et notochorde"
subtitle: "Plaque, plis, tube neural · crête neurale · neuropores J24-25 / J26 · défauts · notochorde"
source: "S2-2 p.5b à 9h"
chapter: "Partie II — III. Gastrulation, somitogenèse et neurulation — 3 et 4"
objectives:
  - "Décrire la formation de l'ectoderme, de la plaque neurale au tube neural, et les devenirs des trois dérivés."
  - "Donner la chronologie de la fermeture du tube neural (J22, J24-25, J26)."
  - "Décrire les défauts de fermeture du tube neural et leurs fréquences."
  - "Décrire la notochorde : rôle, devenir et formation (processus notochordal, plaque, canal neurentérique)."

scenes:
  - kind: hook
    title: "Une fermeture éclair dans le dos"
    ref: "S2-2 p.6b"
    big: "J22"
    beats:
      - say: "Au vingt-deuxième jour, une gouttière commence à se refermer au milieu de ton dos, comme une fermeture éclair, dans les deux sens."
      - say: "Au programme : l'ectoderme, le tube neural, la crête neurale, les défauts de fermeture, et la notochorde."
        show: "*Tube neural* · crête neurale · défauts · *notochorde*"

  - kind: figure
    title: "Formation de l'ectoderme"
    ref: "S2-2 p.5b"
    fig: "S2-2:5b"
    trap: "Neurulation INDUITE par le nœud primitif ; oro-pharyngée crânial, cloacale caudal."
    beats:
      - say: "Ce qui reste de l'épiblaste devient l'*ectoderme*."
        mark: "Ce qui reste de l’épiblaste"
        show: "Reste de l'épiblaste → *ectoderme*"
      - say: "Deux membranes, où l'ectoderme s'accole à l'endoderme : l'oro-pharyngée, côté crânial, future cavité orale ; et la cloacale, côté caudal, future ouverture anale, urinaire et génitale."
        mark: ["oro-pharyngée", "cloacale"]
        show: "*Oro-pharyngée* (crânial → bouche) · *cloacale* (caudal → anus, urinaire, génital)"
      - say: "L'ectoderme se différencie en *ectoderme de surface* et en *neuroectoderme*, qui forme la *plaque neurale* et la gouttière neurale. C'est la neurulation, induite par le nœud primitif."
        mark: ["neuroectoderme", "plaque neurale"]
        show: "→ ectoderme de *surface* · → *neuroectoderme* : plaque + gouttière (induite par le *nœud*)"

  - kind: figure
    title: "Du pli neural au tube neural"
    ref: "S2-2 p.6h"
    fig: "S2-2:6h"
    beats:
      - say: "La plaque neurale se replie : ce sont les *plis neuraux*, un mélange de neuroectoderme et d'ectoderme de surface."
        mark: "plis neuraux"
        show: "Repliement → *plis neuraux* (neuroectoderme + surface)"
      - say: "Les plis se ferment par-dessus la gouttière. On obtient trois choses : le *tube neural* ; les cellules de la *crête neurale*, par transition épithélio-mésenchymateuse au niveau des plis ; et l'ectoderme de surface, séparé par-dessus."
        mark: ["tube neural", "crête neurale"]
        show: "*Tube neural* · *crête neurale* (TEM aux plis) · ectoderme de *surface* au-dessus"
      - say: "Durant l'organogenèse : le tube neural donne le cerveau et la moelle épinière. La crête neurale donne les mélanocytes, le système nerveux entérique, le cartilage et les os de la face, et les odontoblastes. L'ectoderme de surface donne l'épiderme."
        mark: ["mélanocytes", "épiderme"]
        show: "Tube → cerveau, moelle · crête → *mélanocytes*, SN entérique, face, *odontoblastes* · surface → *épiderme*"

  - kind: figure
    title: "Fermeture du tube neural"
    ref: "S2-2 p.6b"
    fig: "S2-2:6b"
    trap: "Début J22 (partie MÉDIANE) ; crânial J24-25 AVANT caudal J26."
    beats:
      - say: "Chez l'homme, la fermeture du tube neural débute au *jour vingt-deux*, dans la *partie médiane* de l'embryon."
        mark: ["jour 22", "partie médiane"]
        show: "Début : *J22*, partie *médiane*"
      - say: "Elle progresse dans les deux directions, laissant transitoirement deux ouvertures, les *neuropores*, côté crânial et côté caudal."
        mark: ["neuropores", "deux directions"]
        show: "2 directions · *neuropores* crânial et caudal"
      - say: "Ils finiront par se fermer : le neuropore *crânial* aux jours *vingt-quatre à vingt-cinq*, le neuropore *caudal* au jour *vingt-six*."
        mark: ["Neuropore crânial", "Neuropore caudal"]
        show: "# Crânial *J24-25* · caudal *J26*"

  - kind: figure
    title: "Devenirs de l'ectoderme"
    ref: "S2-2 p.7h"
    fig: "S2-2:7h"
    beats:
      - say: "Le tableau des devenirs. Ectoderme de surface : épiderme. Cellules de la crête neurale : mélanocytes, système nerveux entérique, face, dents, os."
        mark: ["Epiderme", "Mélanocytes"]
        show: "Surface → épiderme · crête → mélanocytes, SN entérique, face"
      - say: "Neuroectoderme, par le tube neural : encéphale, moelle épinière, nerfs spinaux. Attention, liste non exhaustive."
        mark: ["Encéphale", "Liste non exhaustive"]
        show: "Neuroectoderme → encéphale, moelle, nerfs spinaux · *liste non exhaustive*"

  - kind: figure
    title: "Défauts de fermeture du tube neural"
    ref: "S2-2 p.7b"
    fig: "S2-2:7b"
    trap: "Anencéphalie = neuropore CRÂNIAL (1/5000) ; spina bifida = portion MÉDIANE (1/2000)."
    beats:
      - say: "Les défauts de fermeture du tube neural causent des malformations, dont certaines ne sont pas si rares."
        show: "Défauts de fermeture : *pas si rares*"
      - say: "L'*anencéphalie*, une naissance sur cinq mille : défaut de fermeture du *neuropore crânial* ; absence totale ou partielle du cerveau et du crâne ; décès à la naissance ou après quelques jours."
        mark: ["Anencéphalie (1/5000", "Neuropore crânial"]
        show: "*Anencéphalie* (*1/5000*) : neuropore *crânial* · pas de cerveau ni de crâne"
      - say: "Le *spina bifida*, une naissance sur deux mille : absence de fermeture dans la portion *médiane* du neurotube ; défaut d'une ou plusieurs vertèbres, protrusion plus ou moins importante de la moelle, ouverte ou fermée ; paralysie de gravité variable, troubles sensitifs, incontinence."
        mark: ["Spina bifida (1/2000", "portion médiane"]
        show: "*Spina bifida* (*1/2000*) : portion *médiane* · vertèbres · moelle · paralysie"
      - say: "La figure cite aussi : craniorachischisis et spina bifida ouverte, moins d'une sur dix mille ; iniencéphalie, une sur dix mille ; encéphalocèle, une sur cinq mille ; spina bifida fermée, une sur deux mille."
        mark: ["Craniorachischistosis", "Encéphalocèle"]
        show: "Craniorachischisis, SB ouverte *< 1/10 000* · iniencéphalie *1/10 000* · encéphalocèle *1/5000* · SB fermée *1/2000*"

  - kind: figure
    title: "La notochorde"
    ref: "S2-2 p.8h"
    fig: "S2-2:8h"
    trap: "Chez l'homme, disparaît dans l'enfance → intégrée dans les DISQUES intervertébraux."
    beats:
      - say: "La *notochorde* : une structure rigide et flexible, commune aux *chordés*."
        mark: "chordés"
        show: "*Notochorde* : rigide et flexible · commune aux *chordés*"
      - say: "Chez l'homme, elle disparaît dans l'enfance, intégrée dans les *disques intervertébraux*. Pendant l'embryogenèse, c'est un *centre inducteur* du tube neural et des corps vertébraux."
        mark: ["disques intervertébraux", "centre inducteur"]
        show: "→ *disques intervertébraux* · *centre inducteur* (tube neural, corps vertébraux)"
      - say: "Sur la coupe, de dorsal à ventral : ectoderme de surface, tube neural, mésoderme, notochorde, endoderme."
        show: "Dorsal → ventral : surface · tube neural · mésoderme · *notochorde* · endoderme"

  - kind: figure
    title: "Formation de la notochorde"
    ref: "S2-2 p.8b-9h"
    fig: "S2-2:8b"
    trap: "Processus notochordal = involution par le NŒUD ; canal neurentérique TRANSITOIRE."
    beats:
      - say: "Des cellules de l'épiblaste sont mobilisées à travers le *nœud primitif* : c'est une *involution*. Un tube creux s'allonge en position médiane, sous l'ectoderme, en direction crâniale : le *processus notochordal*."
        mark: ["involution", "processus notochordal"]
        show: "Nœud primitif (*involution*) → tube creux crânial = *processus notochordal*"

  - kind: figure
    title: "Plaque notochordale et notochorde"
    ref: "S2-2 p.9h"
    fig: "S2-2:9h"
    trap: "Canal neurentérique TRANSITOIRE ; notochorde = tige pleine."
    beats:
      - say: "Le processus notochordal fusionne avec l'endoderme : c'est la *plaque notochordale*. Apparaît alors, transitoirement, le *canal neurentérique*, qui relie la cavité amniotique et la vésicule ombilicale."
        mark: ["plaque notochordale", "canal neurentérique"]
        show: "Fusion avec l'endoderme → *plaque notochordale* · *canal neurentérique* (transitoire)"
      - say: "Enfin, la plaque notochordale se détache de l'endoderme : c'est la *notochorde*, une tige pleine."
        mark: "notochorde (tige pleine)"
        show: "Détachement → *notochorde* (*tige pleine*)"

  - kind: trap
    title: "Les pièges de la neurulation"
    ref: "S2-2 p.6-9"
    beats:
      - say: "Trois pièges."
      - say: "“Le neuropore caudal se ferme en premier” : faux. Crânial aux jours vingt-quatre, vingt-cinq ; caudal au jour vingt-six."
        show: "✓ *Crânial* J24-25 → *caudal* J26"
      - say: "“L'anencéphalie est un défaut du neuropore caudal” : faux, du neuropore crânial."
        show: "✓ Anencéphalie = neuropore *crânial*"
      - say: "“Les mélanocytes dérivent de l'ectoderme de surface” : faux, de la crête neurale."
        show: "✓ Mélanocytes = *crête neurale*"

  - kind: mnemo
    title: "Mémoriser"
    ref: "S2-2 p.6-7"
    beats:
      - say: "La crête neurale, c'est “MEFO” : Mélanocytes, système nerveux Entérique, Face, Odontoblastes."
        show: "Crête : *M*élanocytes · *E*ntérique · *F*ace · *O*dontoblastes"
      - say: "Les neuropores : vingt-deux, on ferme ; vingt-quatre-vingt-cinq, la tête ; vingt-six, la queue."
        show: "*22* début · *24-25* tête · *26* queue"

  - kind: quiz
    title: "Quiz express"
    ref: "S2-2 p.8h"
    question: "Que devient la notochorde chez l'homme ?"
    options:
      - "Le tube neural"
      - "Les corps vertébraux"
      - "Elle est intégrée dans les disques intervertébraux"
      - "La moelle épinière"
    answer: [2]
    beats:
      - say: "Quiz : que devient la notochorde chez l'homme ?"
        countdown: 4
      - say: "Elle disparaît dans l'enfance, intégrée dans les disques intervertébraux."
        reveal: true

  - kind: outro
    title: "Épisode 51 : totipotence et pluripotence"
    ref: "S2-2 p.9b"
    big: "Toti / pluri"
    beats:
      - say: "Prochain épisode : différenciation cellulaire, totipotence, pluripotence et cellules souches embryonnaires."
        show: "*Totipotence* · pluripotence · cellules souches"

recap:
  - "Ectoderme = ce qui reste de l'épiblaste ; membranes oro-pharyngée (crânial) et cloacale (caudal) : accolement ectoderme/endoderme (futures cavité orale et ouverture anus/urinaire/génital) ; différenciation en ectoderme de surface et neuroectoderme → plaque neurale (+ gouttière) ; neurulation induite par le nœud primitif."
  - "Repliement de la plaque → plis neuraux (neuroectoderme + ectoderme de surface) ; fermeture des plis par-dessus la gouttière → tube neural, cellules de la crête neurale (TEM au niveau des plis), ectoderme de surface séparé par-dessus. Devenirs : tube neural → cerveau (encéphale), moelle épinière (nerfs spinaux) ; crête neurale → mélanocytes, SN entérique, cartilage/os de la face, odontoblastes ; ectoderme de surface → épiderme (liste non exhaustive)."
  - "Fermeture du tube neural : débute au jour 22 dans la partie médiane ; évolue dans les deux directions ; neuropores crânial (fermé J24-25) et caudal (J26)."
  - "Défauts : anencéphalie (1/5000 ; neuropore crânial ; absence totale ou partielle du cerveau et du crâne ; décès à la naissance ou après quelques jours) ; spina bifida (1/2000 ; absence de fermeture dans la portion médiane ; défaut d'une ou plusieurs vertèbres, protrusion de la moelle, ouverte ou fermée ; paralysie, troubles sensitifs, incontinence). Figure : craniorachischisis (< 1/10 000), spina bifida ouverte (< 1/10 000), iniencéphalie (1/10 000), encéphalocèle (1/5000), spina bifida fermée (1/2000)."
  - "Notochorde : structure rigide et flexible, commune aux chordés ; chez l'homme disparaît dans l'enfance (intégrée dans les disques intervertébraux) ; centre inducteur du tube neural et des corps vertébraux. Formation : cellules de l'épiblaste à travers le nœud primitif (involution) → tube creux médian sous l'ectoderme, vers le crânial = processus notochordal ; fusion avec l'endoderme → plaque notochordale ; canal neurentérique transitoire (cavité amniotique ↔ vésicule ombilicale) ; détachement → notochorde (tige pleine)."

